<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>廿四道·城外 — 雨夜破祠</title>
<style>
/* Orientation LOCKED: landscape 16:9 — see docs/ORIENTATION.md */
:root {
  --earth: #5c4033;
  --rain: #3d5a5b;
  --candle: #c4a574;
  --candle-bright: #e0c890;
  --paper: #f3ebd8;
  --ink: #1a1612;
  --ink-soft: #2a2218;
  --text: #f3ebd8;
  --text-dim: #c4b8a4;
  --fade: 0.4s;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ui-dialog: url("images/ui/dialog_box.png");
  --ui-dialog-alt: url("images/ui/dialog_box_alt.png");
  --ui-name: url("images/ui/nameplate.png");
  --ui-choice: url("images/ui/choice_idle.png");
  --ui-choice-h: url("images/ui/choice_hover.png");
  --ui-nav: url("images/ui/btn_nav.png");
  --ui-nav2: url("images/ui/btn_nav_alt.png");
  --ui-bar: url("images/ui/bottom_bar.png");
  --ui-bubble: url("images/ui/bubble.png");
  --ui-panel: url("images/ui/ll_panel_settings_panel.png");
  --ui-heart-on: url("images/ui/ll_nav_hearts_filled.png");
  --ui-heart-off: url("images/ui/ll_nav_hearts_empty.png");
  --ui-continue: url("images/ui/btn_continue.png");
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: #000; color: var(--text);
  font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", "PingFang SC", serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center;
}
#app {
  /* Stage: 16:9 landscape; letterbox only outside (body #000) */
  position: relative; width: min(100vw, calc(100dvh * 16 / 9), 1280px);
  aspect-ratio: 16 / 9; height: auto; max-height: 100dvh;
  margin: 0 auto; background: var(--ink);
  overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.65);
}
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column;
  opacity: 0; transition: opacity var(--fade) ease; z-index: 1;
}
.screen.active { display: flex; opacity: 1; z-index: 2; }

/* ripple */
.ripple-host { position: relative; overflow: hidden; }
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(196,165,116,.45) 0%, transparent 70%);
  transform: scale(0); animation: rip .55s ease-out forwards;
}
@keyframes rip { to { transform: scale(2.6); opacity: 0; } }

/* ===== HOME ===== */
#home { background: #0a0806; }
.home-scene { position: absolute; inset: 0; overflow: hidden; }
.home-scene .bg {
  position: absolute; inset: 0; background-size: cover;
  background-position: center center; background-repeat: no-repeat;
  transform: scale(1.03); transition: filter .6s, opacity .5s;
}
.home-scene .char {
  position: absolute; left: 50%; bottom: 10%;
  width: auto; max-width: 42%; height: 88%;
  transform: translateX(-50%);
  background-size: contain; background-position: center bottom;
  background-repeat: no-repeat;
  filter: drop-shadow(0 10px 28px rgba(0,0,0,.55));
  transition: transform .3s, filter .3s; pointer-events: none;
}
.home-scene .char.react {
  transform: translateX(-50%) scale(1.02);
  filter: drop-shadow(0 10px 32px rgba(196,165,116,.35));
}
.home-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg,
    rgba(10,8,6,.5) 0%, transparent 16%,
    transparent 40%, rgba(10,8,6,.45) 60%,
    rgba(10,8,6,.96) 100%);
}
.hotzones { position: absolute; inset: 0; z-index: 4; }
.hotzone {
  position: absolute; border-radius: 50%;
  background: transparent; border: 0; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.hotzone::after {
  content: ""; position: absolute; inset: 10%;
  background: url("images/ui/hotzone_ring.png") center/contain no-repeat;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
.hotzone:active::after, .hotzone.flash::after { opacity: .85; }
.hz-shoulder { left: 38%; top: 22%; width: 12%; height: 16%; }
.hz-sleeve { left: 52%; top: 42%; width: 11%; height: 16%; }
.hz-blade { left: 42%; top: 58%; width: 14%; height: 14%; }
.home-top {
  position: relative; z-index: 5;
  padding: calc(16px + var(--safe-t)) 16px 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.home-title-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; letter-spacing: .32em; color: var(--candle);
}
.home-title-row .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--candle); box-shadow: 0 0 8px var(--candle);
}
.home-subtitle { font-size: 11px; letter-spacing: .18em; color: var(--text-dim); }
.home-affinity { display: flex; gap: 4px; margin-top: 4px; }
.aff-pip {
  width: 18px; height: 16px;
  background: var(--ui-heart-off) center/contain no-repeat; opacity: .45;
}
.aff-pip.on { background-image: var(--ui-heart-on); opacity: 1; }
.home-status {
  position: absolute; left: 0; right: 0; bottom: 22%;
  z-index: 5; text-align: center; padding: 0 22px; pointer-events: none;
}
.home-name {
  font-size: 24px; letter-spacing: .3em; color: var(--candle-bright);
  text-shadow: 0 2px 18px rgba(0,0,0,.8); font-weight: 500;
}
.home-mood {
  margin-top: 8px; font-size: 13px; line-height: 1.7;
  color: var(--paper); letter-spacing: .06em;
  text-shadow: 0 1px 8px rgba(0,0,0,.9);
}
.home-status-bubble {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; padding: 6px 14px 6px 12px;
  background: url("images/ui/status_chip.png") center/100% 100% no-repeat;
  font-size: 11px; letter-spacing: .12em; color: var(--candle-bright);
  min-width: 120px; justify-content: center; pointer-events: auto;
}
.home-status-bubble .pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: #7ec8a0; box-shadow: 0 0 8px #7ec8a0;
  animation: breath 2.4s ease infinite;
}
@keyframes breath {
  0%,100% { opacity: .45; transform: scale(.9); }
  50% { opacity: 1; transform: scale(1.15); }
}
.home-bubble {
  position: absolute; left: 50%; bottom: 30%;
  transform: translateX(-50%) translateY(8px);
  z-index: 8; max-width: 56%; min-width: 200px;
  padding: 14px 18px 16px;
  background: var(--ui-bubble) center/100% 100% no-repeat;
  font-size: 14px; letter-spacing: .06em; color: var(--paper);
  opacity: 0; pointer-events: none; text-align: center;
  transition: opacity .28s, transform .28s;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.home-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.home-nav {
  position: absolute; left: 8px; right: 8px;
  bottom: calc(10px + var(--safe-b));
  z-index: 6; display: flex; gap: 6px;
  padding: 10px 6px 8px;
  background: var(--ui-bar) center bottom / 100% 100% no-repeat;
  border-radius: 16px;
}
.nav-btn {
  flex: 1; appearance: none; border: 0;
  background: var(--ui-nav) center/100% 100% no-repeat;
  color: var(--paper); padding: 14px 4px 12px;
  font-size: 12px; letter-spacing: .1em; font-family: inherit;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 2px; min-height: 56px;
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
  transition: transform .12s, filter .2s;
}
.nav-btn:nth-child(even) { background-image: var(--ui-nav2); }
.nav-btn .ico { font-size: 15px; line-height: 1; opacity: .95; color: var(--candle-bright); }
.nav-btn:active { transform: scale(.96); filter: brightness(1.12); }
.nav-btn.primary { filter: saturate(1.15) brightness(1.05); }
.home-debug {
  position: absolute; top: calc(10px + var(--safe-t)); right: 10px; z-index: 10;
  font-size: 10px; letter-spacing: .1em; color: var(--candle); opacity: .35;
  background: transparent; border: 1px solid rgba(196,165,116,.3);
  border-radius: 8px; padding: 5px 8px; font-family: inherit; cursor: pointer;
}
.credit-foot {
  position: absolute; left: 0; right: 0; bottom: calc(78px + var(--safe-b));
  z-index: 5; text-align: center; pointer-events: none;
  font-size: 9px; letter-spacing: .08em; color: rgba(196,165,116,.35); line-height: 1.5;
}

/* ===== HOMELAND ===== */
#homeland { background: #0a0806; }
.hl-scene { position: absolute; inset: 0; overflow: hidden; }
.hl-scene .bg {
  position: absolute; inset: 0; background-size: cover;
  background-position: center center; transition: filter .5s, opacity .45s;
}
.hl-scene .char {
  position: absolute; left: 50%; bottom: 12%;
  width: auto; max-width: 36%; height: 78%;
  transform: translateX(-50%);
  background-size: contain; background-position: center bottom;
  background-repeat: no-repeat; transition: opacity .4s;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,.45));
  pointer-events: none;
}
.hl-scene .char.away { opacity: 0; }
.hl-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,8,6,.4), transparent 20%, transparent 50%, rgba(10,8,6,.85));
}
.hl-spots { position: absolute; inset: 0; z-index: 4; }
.hl-spot {
  position: absolute; border: 0; background: transparent; border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 10%; color: var(--candle-bright);
  font-size: 11px; letter-spacing: .14em; font-family: inherit;
  text-shadow: 0 1px 4px rgba(0,0,0,.85);
  transition: transform .12s, filter .2s;
}
.hl-spot::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: url("images/ui/hotzone_ring.png") center/contain no-repeat;
  opacity: .7; transition: opacity .2s, transform .2s; pointer-events: none;
}
.hl-spot:active { transform: scale(.96); filter: brightness(1.15); }
.hl-spot:active::after { opacity: .95; }
.hl-spot.disabled { opacity: .35; pointer-events: none; }
.hl-bed { left: 4%; top: 38%; width: 30%; height: 28%; }
.hl-altar { left: 36%; top: 28%; width: 28%; height: 24%; }
.hl-stove { right: 4%; top: 40%; width: 30%; height: 26%; }
.hl-door { left: 28%; bottom: 28%; width: 44%; height: 14%; }
.hl-top {
  position: relative; z-index: 6;
  padding: calc(14px + var(--safe-t)) 14px 0;
  display: flex; align-items: center; gap: 8px;
}
.hl-back {
  appearance: none; border: 1px solid rgba(196,165,116,.4);
  background: rgba(26,22,18,.55); color: var(--candle);
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 18px; font-family: inherit; cursor: pointer;
}
.hl-title { flex: 1; text-align: center; font-size: 15px; letter-spacing: .28em; color: var(--candle-bright); }
.hl-stats {
  position: relative; z-index: 6; margin: 10px 14px 0;
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
}
.hl-pill {
  font-size: 10px; letter-spacing: .1em; padding: 5px 10px;
  background: url("images/ui/status_chip.png") center/100% 100% no-repeat;
  color: var(--paper); min-width: 72px; text-align: center;
}
.hl-pill span { color: var(--candle-bright); }
.hl-actions {
  position: absolute; left: 12px; right: 12px;
  bottom: calc(16px + var(--safe-b)); z-index: 7;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.hl-act {
  appearance: none; border: 0; min-height: 48px;
  background: var(--ui-choice) center/100% 100% no-repeat;
  color: var(--paper); font-family: inherit; font-size: 13px;
  letter-spacing: .12em; cursor: pointer; padding: 12px 8px;
  text-shadow: 0 1px 3px rgba(0,0,0,.7);
}
.hl-act:active { background-image: var(--ui-choice-h); }
.hl-act:disabled { background-image: url("images/ui/choice_disabled.png"); opacity: .55; cursor: default; }
.hl-line {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
  z-index: 8; max-width: 80%; padding: 12px 16px;
  background: var(--ui-bubble) center/100% 100% no-repeat;
  font-size: 13px; color: var(--paper); text-align: center;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.hl-line.show { opacity: 1; }

/* ===== THEATER ===== */
#theater { background: #000; }
.scene-stage { position: absolute; inset: 0; overflow: hidden; background: #0a0806; }
.scene-bg {
  position: absolute; inset: 0; background-size: cover; background-color: #0a0806;
  background-position: center center; background-repeat: no-repeat;
  transition: opacity var(--fade) ease, transform 1.1s ease, filter .7s ease; opacity: 1;
}
.scene-bg.fit-contain { background-size: contain; background-color: #0a0806; }
.scene-bg.fit-cover { background-size: cover; }
.scene-bg.dim { filter: brightness(.45) saturate(.7); transform: scale(1.06); }
.scene-bg.zoom { transform: scale(1.1); }
.scene-char {
  position: absolute; left: 50%; bottom: 4%;
  width: auto; max-width: 48%; height: 90%;
  transform: translateX(-50%);
  background-size: contain; background-position: center bottom;
  background-repeat: no-repeat; opacity: 0;
  transition: opacity .4s, transform 2s ease-in-out;
  pointer-events: none; z-index: 1;
  filter: drop-shadow(0 6px 20px rgba(0,0,0,.4));
  /* landscape: contain + % of stage height — no stretch */
}
.scene-char.show { opacity: 1; }
.scene-char.pos-right {
  left: auto; right: 5%; transform: none;
}
.scene-char.pos-center {
  left: 50%; right: auto; transform: translateX(-50%);
}
.scene-char.cam-zoom {
  transform: translateX(-50%) scale(1.15) translateY(5%);
}
.scene-char.pos-right.cam-zoom {
  transform: scale(1.15) translateY(5%);
}
.scene-mask {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: rgba(8,6,4,.28);
  opacity: 0; transition: opacity .5s;
}
.scene-mask.show { opacity: 1; }
.scene-fx { position: absolute; inset: 0; pointer-events: none; z-index: 2; transition: background .8s; }
.scene-fx.pass-glow {
  background: radial-gradient(ellipse at center, rgba(196,165,116,.22) 0%, transparent 65%);
}
.day-tag {
  position: absolute; top: calc(14px + var(--safe-t)); left: 52px; z-index: 22;
  font-size: 10px; letter-spacing: .2em; padding: 5px 12px;
  background: url("images/ui/status_chip.png") center/100% 100% no-repeat;
  color: var(--candle-bright);
}
.status-bar {
  position: absolute; top: calc(14px + var(--safe-t)); right: 10px; z-index: 20;
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; pointer-events: none;
}
.stat-pill {
  font-size: 10px; letter-spacing: .08em; padding: 5px 12px;
  background: url("images/ui/status_chip.png") center/100% 100% no-repeat;
  border: 0; border-radius: 0; color: var(--candle-bright);
}
.stat-pill span { color: var(--paper); margin-left: 2px; }
.theater-back {
  position: absolute; top: calc(12px + var(--safe-t)); left: 12px; z-index: 25;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(196,165,116,.45);
  background: rgba(26,22,18,.55); color: var(--candle);
  font-size: 18px; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}
.dialogue-layer {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 0 4% calc(10px + var(--safe-b)); pointer-events: none;
}
.dialogue-layer > * { pointer-events: auto; }
.avatar-float {
  position: absolute; left: 4%;
  bottom: calc(128px + var(--safe-b));
  width: 56px; height: 56px; border-radius: 50%;
  border: 1px solid rgba(196,165,116,.45);
  background: rgba(26,22,18,.45) center center / cover no-repeat;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(8px);
  transition: opacity .35s, transform .35s; overflow: hidden;
}
.avatar-float.show { opacity: 1; transform: translateY(0); }
/* Square gallery avatars: fill circle. Vertical sprites: face-bias crop (never full-body in dialog). */
#avatarFloat.av-square { background-size: cover; background-position: center center; }
#avatarFloat.av-sprite { background-size: 200% auto; background-position: center 8%; }
.dialogue-box {
  position: relative; cursor: pointer;
  min-height: 118px; max-height: 38%; padding: 22px 28px 18px;
  background: var(--ui-dialog) center / 100% 100% no-repeat;
  filter: drop-shadow(0 -4px 24px rgba(0,0,0,.45));
}
.dialogue-box.alt { background-image: var(--ui-dialog-alt); }
.nameplate {
  position: absolute; top: -10px; left: 18px;
  min-width: 110px; height: 36px; padding: 0 18px;
  background: var(--ui-name) center / 100% 100% no-repeat;
  display: flex; align-items: center; justify-content: center;
}
.nameplate .name {
  font-size: 13px; letter-spacing: .22em; color: var(--paper);
  text-shadow: 0 1px 3px rgba(0,0,0,.7); background: none; border: 0; padding: 0;
}
.dialogue-text {
  font-size: 15px; line-height: 1.75; letter-spacing: .04em;
  color: var(--paper); min-height: 3.4em; padding-top: 2px;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
}
.dialogue-text.thought { color: var(--text-dim); font-style: italic; }
.dialogue-text .lore {
  color: var(--candle-bright); border-bottom: 1px dashed rgba(196,165,116,.55);
  cursor: pointer;
}
.tap-hint {
  position: absolute; right: 18px; bottom: 12px;
  width: 72px; height: 22px;
  background: var(--ui-continue) center/contain no-repeat;
  opacity: .55; animation: pulse 1.8s ease infinite;
  font-size: 0; color: transparent;
}
@keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.75} }
.choices { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
.choices.show { display: flex; }
.choice-btn {
  appearance: none; width: 100%; border: 0;
  background: var(--ui-choice) center / 100% 100% no-repeat;
  color: var(--paper); padding: 16px 22px; min-height: 52px;
  font-size: 14px; letter-spacing: .06em; font-family: inherit;
  cursor: pointer; text-align: left; line-height: 1.5;
  text-shadow: 0 1px 3px rgba(0,0,0,.65);
  transition: transform .12s, filter .15s;
}
.choice-btn:active, .choice-btn:hover {
  background-image: var(--ui-choice-h); transform: scale(.985); filter: brightness(1.08);
}
.ending-card {
  position: absolute; inset: 0; z-index: 40;
  display: none; align-items: center; justify-content: center;
  background: rgba(8,6,4,.84); backdrop-filter: blur(10px);
  padding: 32px; opacity: 0; transition: opacity .5s;
}
.ending-card.show { display: flex; opacity: 1; }
.ending-inner {
  width: 100%; max-width: 480px; padding: 36px 28px 28px; text-align: center;
  background: url("images/ui/ll_panel_settings_panel.png") center/100% 100% no-repeat;
  filter: drop-shadow(0 16px 40px rgba(0,0,0,.5));
}
.ending-inner .label { font-size: 11px; letter-spacing: .4em; color: var(--candle); margin-bottom: 14px; }
.ending-inner h2 { font-size: 20px; letter-spacing: .22em; color: var(--candle-bright); font-weight: 500; margin-bottom: 16px; }
.ending-inner p { font-size: 13px; line-height: 1.95; color: var(--paper); letter-spacing: .04em; margin-bottom: 22px; text-align: left; }
.ending-inner button {
  appearance: none; border: 0; min-width: 160px; min-height: 44px;
  background: url("images/ui/ll_btn_gradient_button.png") center/100% 100% no-repeat;
  color: var(--paper); padding: 10px 24px; font-family: inherit;
  font-size: 13px; letter-spacing: .2em; cursor: pointer;
  text-shadow: 0 1px 3px rgba(0,0,0,.6);
}

/* panels shared */
#postcard, #away, #gallery { background: #0e0c09; }
.panel-header {
  padding: calc(26px + var(--safe-t)) 22px 10px; text-align: center; position: relative; z-index: 2;
}
.panel-header h1 { font-size: 18px; letter-spacing: .28em; color: var(--candle-bright); font-weight: 500; }
.panel-header p { margin-top: 8px; font-size: 12px; color: var(--text-dim); letter-spacing: .1em; line-height: 1.7; }
.panel-back {
  position: absolute; left: 14px; top: calc(24px + var(--safe-t));
  border: none; background: transparent; color: var(--candle);
  font-size: 14px; letter-spacing: .1em; font-family: inherit; cursor: pointer; padding: 6px 8px;
}
.card-grid {
  flex: 1; overflow-y: auto; padding: 12px 18px 28px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-content: start;
}
.pcard {
  aspect-ratio: 16/9; border-radius: 10px;
  background: url("images/ui/ll_panel_gallery_grid_item.png") center/100% 100% no-repeat;
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.pcard.unlocked {
  background-size: cover; background-position: center center;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); border: 1px solid rgba(196,165,116,.4);
}
.pcard .slot-label {
  font-size: 11px; color: var(--text-dim); letter-spacing: .12em; text-align: center; padding: 8px; opacity: .7;
}
.pcard.unlocked .slot-label {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: linear-gradient(transparent, rgba(13,11,9,.9));
  padding: 24px 8px 12px; color: var(--candle-bright); opacity: 1;
}
.pcard.locked-ch { flex-direction: column; gap: 8px; }

/* 兼容旧单图 fallback */

.gal-d-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.gal-d-fx.rain::before, .gal-d-fx.rain::after {
  content: ""; position: absolute; inset: -20% 0;
  background-image: repeating-linear-gradient(105deg, transparent 0 8px, rgba(180,200,220,.07) 8px 9px);
  animation: rainDrift 4.5s linear infinite; opacity: .55;
}
.gal-d-fx.rain::after { animation-duration: 6.2s; opacity: .3; transform: translateX(12px); }
@keyframes rainDrift { from { transform: translateY(-8%); } to { transform: translateY(12%); } }
.gal-d-fx.frost .spark {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: #f0e0b0; box-shadow: 0 0 6px #e8d5a8;
  animation: frostFall 2.4s ease-out forwards; opacity: 0;
}
@keyframes frostFall {
  0% { opacity: 0; transform: translateY(-8px) scale(.6); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(120%) scale(1.1); }
}
.gal-d-frame { position: absolute; inset: 10px; pointer-events: none; border-radius: 4px; z-index: 2; border: 1px solid rgba(196,165,116,.45); }
.gal-d-frame.SSR { box-shadow: inset 0 0 0 2px rgba(232,213,168,.2), 0 0 28px rgba(196,165,116,.2); }
.gal-d-frame.UR {
  border-color: rgba(167,139,250,.5);

}
.gal-d-fx.star .spark {

}
@keyframes starTwinkle {

  40% { opacity: .85; transform: scale(1.15); }
  70% { opacity: .35; transform: scale(.9); }
}

}

/* ===== FERRY CINEMA ===== */
.cinema-layer {
  position: absolute; inset: 0; z-index: 12;
  background: #000; opacity: 0;
  transition: opacity 1.5s ease-in-out;
  pointer-events: none;
}
.cinema-layer.show { opacity: 1; pointer-events: auto; }
.cinema-layer.video-lock { pointer-events: none; }
.cinema-frame {
  position: absolute; inset: 0; overflow: hidden; background: #000;
}
.cinema-frame img,
.cinema-frame video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; opacity: 0;
  transition: opacity 1.5s ease-in-out;
  transform-origin: center center;
  will-change: transform, opacity;
}
.cinema-frame img.visible,
.cinema-frame video.visible { opacity: 1; }
.cinema-frame img.zoom05 { animation: slowZoom05 8s linear forwards; }
.cinema-frame img.zoom11 { animation: slowZoom11 6s linear forwards; }
.cinema-frame img.breath { animation: breathPulse 4.5s ease-in-out infinite; }
@keyframes slowZoom05 {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}
@keyframes slowZoom11 {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}
@keyframes breathPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.012); }
}
.cinema-vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse at center,

}

}
body.cinema-lock .tap-hint { display: none !important; }
body.cinema-lock .theater-back { opacity: .25; }

.home-avatar-badge {

const NODES = {"n01": {"bg": "bg_shrine_rain", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "雨声先于意识回来。冷从石阶缝里爬上来，像要把人重新嵌进地里。我睁开眼——破祠梁上，漏着一线夜色。", "next": "n02", "day": "第一夜", "id": "n01", "scene": "破祠·外廊", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "night", "present": ["谢知年"]}, "n02": {"bg": "bg_shrine_rain", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "记得逃出城时，天边有一道细亮。旁人叫它[[天缝]]。我却只记得脚软、喉干，以及——自己大概快成一具[[病壳]]了。", "next": "n03", "delta": {"壳": 1}, "day": "第一夜", "id": "n02", "scene": "破祠·外廊", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "night", "present": ["谢知年"]}, "n03": {"bg": "bg_shrine_leak", "avatar": null, "speaker": "narr", "name": "", "text": "左边是地铺，中间立着斑驳的土地神像，右边灶口余温将尽。后门虚掩，风雨从缝里挤进来。这破祠的布局，像有人常住，又像久无人问。", "next": "n04", "day": "第一夜", "id": "n03", "scene": "破祠·漏雨", "speaker_label": "旁白", "is_choice": false, "emotion": null, "shot": "全景", "sprite": null, "time_of_day": "night", "present": []}, "n04": {"bg": "bg_shrine_rain", "avatar": "xie_weak", "speaker": "thought", "name": "谢知年", "text": "我试着撑起半身，胸口一阵空。魂像被雨洗薄了，只剩壳还勉强撑着形状。", "next": "n05", "day": "第一夜", "id": "n04", "scene": "破祠·外廊", "speaker_label": "谢知年", "is_choice": false, "emotion": "虚弱", "shot": "近景", "sprite": "xie_weak", "time_of_day": "night", "present": ["谢知年"]}, "n05": {"bg": "bg_shrine_door", "avatar": null, "speaker": "narr", "name": "", "text": "门槛外，雨帘忽然被一只手掀开。水珠从斗笠边沿滚落，砸在青石上，一声极轻。", "next": "n06", "day": "第一夜", "id": "n05", "scene": "破祠·后门", "speaker_label": "旁白", "is_choice": false, "emotion": null, "shot": "全景", "sprite": null, "time_of_day": "night", "present": []}, "n06": {"bg": "cg_enter", "avatar": "gu_wet", "speaker": "thought", "name": "谢知年", "text": "他站在雨里，衣摆湿透，却不像狼狈。窄脸，短小髻，右眉梢有一道淡疤。土黄麻衣贴在肩上。他只是看着我，像在确认：这具壳，还值不值得捡。", "next": "n07", "delta": {"心": 1}, "day": "第一夜", "id": "n06", "scene": "破祠·门槛", "speaker_la 3": {"bg": "cg_wrist_close", "avatar": "gu_worry", "speaker": "gu", "name": "顾山", "text": "这算不算医？", "next": "n14", "effect": "pass", "day": "第一夜", "id": "n13", "scene": "破祠·渡灵", "speaker_label": "顾山", "is_choice": false, "emotion": "凝视", "shot": "特写", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n14": {"bg": "cg_ferry", "avatar": "gu_worry", "speaker": "thought", "name": "谢知年", "text": "他掌心覆在我腕脉上。不暧昧，不催促，只是把将散的气，一点一点渡回来——旁人或许会称这为[[渡灵]]。我却只觉得，自己的壳终于不那么空了。", "next": "n15", "effect": "ferry_cinema", "delta": {"魂": 2, "壳": 1}, "day": "第一夜", "id": "n14", "scene": "破祠·腕脉", "speaker_label": "谢知年", "is_choice": false, "emotion": "凝视", "shot": "特写", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n15": {"bg": "cg_pass", "avatar": "xie_awake", "speaker": "xie", "name": "谢知年", "text": "……我好像，又能听见自己的心跳了。", "next": "n16", "day": "第一夜", "id": "n15", "scene": "破祠·渡灵", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "特写", "sprite": "xie_awake", "time_of_day": "night", "present": ["谢知年"]}, "n16": {"bg": "cg_pass", "avatar": "gu_worry", "speaker": "gu", "name": "顾山", "text": "先活。", "next": "n17", "effect": "clear", "day": "第一夜", "id": "n16", "scene": "破祠·渡灵", "speaker_label": "顾山", "is_choice": false, "emotion": "凝视", "shot": "特写", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n17": {"bg": "cg_carry_in", "avatar": "gu_idle", "speaker": "narr", "name": "", "text": "雨小了些。他把我挪进祠后窝棚。左仍是铺，中无土地神的小小香位，右灶火正跳。后门闭着，柴烟与雨气搅在一起。锅里不知煮着什么，气味清淡，却让人想活。", "next": "n18", "day": "第一夜", "id": "n17", "scene": "破祠·搀入", "speaker_label": "旁白", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n18": {"bg": "cg_fire_share", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "他没有立刻离开。只把湿斗笠挂到钉上，袖口的水滴在青砖上，一圈一圈晕开。我裹着薄毯坐在地铺上，忽然不想结束这段沉默。", "next": "n19", "delta": {"心": 1}, "day": "第一夜", "id": "n18", "scene": "破祠·共火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "特写", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "n19": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "xie", "name": "谢知年", "text": "……敢问恩人尊姓？", "next": "n20", "day": "第一夜", "id": "n19", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n20": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "顾山。", "next": "n21", "day": "第一夜", "id": "n20", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n21": {"bg": "bg_hut_fire", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "两个字。像钉进木头里的楔——短，却扣得住。我在心里默念了一遍。", "next": "choice_intro", "day": "第一夜", "id": "n21", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "choice_intro": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "xie", "name": "谢知年", "text": "火光跳了一跳。我该怎么开口？", "day": "第一夜", "choices": [{"text": "报上姓名：「我叫谢知年。」", "next": "intro_name", "delta": {"信": 1, "心": 1}}, {"text": "只道谢：「今夜……多亏你。」", "next": "intro_thanks", "delta": {"信": 1}}, {"text": "试探：「城外可有[[廿四道]]？」", "next": "intro_path", "delta": {"魂": 1}}], "id": "choice_intro", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": true, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "intro_name": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "记下了。", "next": "intro_merge", "day": "第一夜", "id": "intro_name", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "intro_thanks": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "不必。", "next": "intro_merge", "day": "第一夜", "id": "intro_thanks", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "intro_path": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "不记得就不记得。", "next": "intro_merge", "day": "第一夜", "id": "intro_path", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "intro_merge": {"bg": "bg_hut_fire", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "他并不追问我从哪来。话少得像在省气。可偏是这种省，让人更想知道他藏了什么。", "next": "n22", "day": "第一夜", "id": "intro_merge", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "n22": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "xie", "name": "谢知年", "text": "你为何救我？", "next": "n23", "day": "第一夜", "id": "n22", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n23": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "路过。", "next": "n24", "day": "第一夜", "id": "n23", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n24": {"bg": "bg_hut_fire", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "路过。两个字把所有修辞都挡在门外。我却听出一点别的——他习惯把「救」说成「路过」，像把恩情压成雨声。", "next": "n25", "day": "第一夜", "id": "n24", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "n25": {"bg": "bg_hut_fire", "avatar": "gu_worry", "speaker": "xie", "name": "谢知年", "text": "你常一个人在这山里？", "next": "n26", "day": "第一夜", "id": "n25", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "凝视", "shot": "近景", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n26": {"bg": "bg_hut_fire", "avatar": "gu_worry", "speaker": "gu", "name": "顾山", "text": "猎户。", "next": "n27", "day": "第一夜", "id": "n26", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "凝视", "shot": "近景", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n27": {"bg": "bg_hut_fire", "avatar": "gu_worry", "speaker": "gu", "name": "顾山", "text": "别出门，山里有脚印。", "next": "n28", "delta": {"信": 1}, "day": "第一夜", "id": "n27", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "凝视", "shot": "近景", "sprite": "gu_worry", "time_of_day": "night", "present": ["顾山"]}, "n28": {"bg": "bg_hut_fire", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "脚印。他没说是谁的。语气平，像报天气。我点了点头，把话咽回去——今夜，先把命留住。", "next": "choice_night", "day": "第一夜", "id": "n28", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "choice_night": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "narr", "name": "", "text": "雨还在下。灶火将尽。你还能做一件小事。", "day": "第一夜", "choices": [{"text": "帮他添一截灶旁干柴", "next": "night_wood", "delta": {"壳": 1, "信": 1}}, {"text": "安静听一会儿雨", "next": "night_rain", "delta": {"魂": 1}}, {"text": "把薄毯往他那边推半寸", "next": "night_blanket", "delta": {"心": 2}}], "id": "choice_night", "scene": "破祠·内·灶火", "speaker_label": "旁白", "is_choice": true, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "night_wood": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "可以。", "next": "night_close", "day": "第一夜", "id": "night_wood", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "night_rain": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "thought", "name": "谢知年", "text": "雨打在瓦漏处，一声一声。他坐在灶边，影子很长。我忽然觉得，活着这件事，也可以只是听雨。", "next": "night_close", "day": "第一夜", "id": "night_rain", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "night_blanket": {"bg": "bg_hut_fire", "avatar": "gu_soft", "speaker": "gu", "name": "顾山", "text": "你用。", "next": "night_close", "day": "第一夜", "id": "night_blanket", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "微软", "shot": "近景", "sprite": "gu_soft", "time_of_day": "night", "present": ["顾山"]}, "night_close": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "我在。", "next": "n29", "day": "第一夜", "id": "night_close", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "night", "present": ["顾山"]}, "n29": {"bg": "cg_night_guard", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "只两个字。却像把门闩从里面扣上了。我躺回地铺，雨声渐远，意识沉进暖意里——这一夜，没有结束在「被救」，而是停在「有人在」。", "next": "n30", "delta": {"心": 1}, "day": "第一夜", "id": "n29", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "night", "present": ["谢知年"]}, "n30": {"bg": "cg_night_guard", "avatar": null, "speaker": "narr", "name": "", "text": "（雨夜入眠）", "next": "d01", "day": "第一夜", "id": "n30", "scene": "破祠·内·灶火", "speaker_label": "旁白", "is_choice": false, "emotion": null, "shot": "全景", "sprite": null, "time_of_day": "night", "present": []}, "d01": {"bg": "bg_hut_dawn", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "灰蓝晨光从门缝挤进来。雨停了大半。我醒来时，屋里已有细碎的声响——不是雨，是绳与木摩擦的声音。", "next": "d02", "day": "次日", "id": "d01", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "d02": {"bg": "cg_dawn_talk", "avatar": "gu_mend", "speaker": "narr", "name": "", "text": "顾山坐在灶边，侧身整理猎具：网绳、短刀、湿了一夜的绑带。动作极稳，像把昨夜所有话都缝进了结里。", "next": "d03", "day": "次日", "id": "d02", "scene": "破祠·晨谈", "speaker_label": "旁白", "is_choice": false, "emotion": "修补", "shot": "特写", "sprite": "gu_mend", "time_of_day": "day", "present": ["顾山"]}, "d03": {"bg": "cg_dawn_talk", "avatar": "gu_mend", "speaker": "xie", "name": "谢知年", "text": "早……你起得很早。", "next": "d04", "day": "次日", "id": "d03", "scene": "破祠·晨谈", "speaker_label": "谢知年", "is_choice": false, "emotion": "修补", "shot": "特写", "sprite": "gu_mend", "time_of_day": "day", "present": ["顾山"]}, "d04": {"bg": "cg_dawn_talk", "avatar": "gu_mend", "speaker": "gu", "name": "顾山", "text": "习惯。", "next": "d05", "day": "次日", "id": "d04", "scene": "破祠·晨谈", "speaker_label": "顾山", "is_choice": false, "emotion": "修补", "shot": "特写", "sprite": "gu_mend", "time_of_day": "day", "present": ["顾山"]}, "d05": {"bg": "cg_dawn_talk", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "他头也不抬。可网绳在指间翻过时，停了一停——像确认我确实醒了。", "next": "d06", "delta": {"心": 1}, "day": "次日", "id": "d05", "scene": "破祠·晨谈", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "特写", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "d06": {"bg": "bg_hut_dawn", "avatar": "gu_mend", "speaker": "gu", "name": "顾山", "text": "粥在锅里。", "next": "choice_explore", "day": "次日", "id": "d06", "scene": "破祠·内·拂晓", "speaker_label": "顾山", "is_choice": false, "emotion": "修补", "shot": "近景", "sprite": "gu_mend", "time_of_day": "day", "present": ["顾山"]}, "choice_explore": {"bg": "bg_hut_dawn", "avatar": "xie_sit", "speaker": "narr", "name": "", "text": "身子还虚，却能慢慢挪两步。你想先看哪里？", "day": "次日", "choices": [{"text": "地铺——自己躺过的草席与薄毯", "next": "ex_bed", "delta": {"壳": 1}}, {"text": "土地神——香灰与斑驳的神像", "next": "ex_god", "delta": {"魂": 1}}, {"text": "灶——余温与粥香", "next": "ex_stove", "delta": {"信": 1}}, {"text": "门——门缝外的山气与脚印方向", "next": "ex_door", "delta": {"心": 1}}], "id": "choice_explore", "scene": "破祠·内·拂晓", "speaker_label": "旁白", "is_choice": true, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "day", "present": ["谢知年"]}, "ex_bed": {"bg": "bg_hut_dawn", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "草席下垫了干茅。薄毯边缘有补丁，针脚乱，却结实。不像临时施舍——更像他习惯把能用的东西留到最后。", "next": "ex_back", "day": "次日", "id": "ex_bed", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "day", "present": ["谢知年"]}, "ex_god": {"bg": "bg_hut_dawn", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "土地神脸上的金漆掉了大半。香灰是新的。有人在雨夜也会上香——不为求财，只求「别再死人」。", "next": "ex_back", "day": "次日", "id": "ex_god", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "ex_stove": {"bg": "bg_hut_dawn", "avatar": "gu_bowl", "speaker": "thought", "name": "谢知年", "text": "锅沿还有昨夜的水渍。粥很稀，米粒却完整。他盛了一碗推过来，目光只在碗上停一瞬。", "next": "ex_back", "day": "次日", "id": "ex_stove", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "递物", "shot": "近景", "sprite": "gu_bowl", "time_of_day": "day", "present": ["顾山"]}, "ex_door": {"bg": "bg_hut_dawn", "avatar": "gu_worry", "speaker": "thought", "name": "谢知年", "text": "门缝外山色青灰。泥地上有几枚旧脚印，被雨冲淡了轮廓。他昨夜说「别出门」——原来不是吓唬。", "next": "ex_back", "day": "次日", "id": "ex_door", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "凝视", "shot": "近景", "sprite": "gu_worry", "time_of_day": "day", "present": ["顾山"]}, "ex_back": {"bg": "bg_hut_dawn", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "吃。", "next": "d07", "day": "次日", "id": "ex_back", "scene": "破祠·内·拂晓", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "d07": {"bg": "bg_hut_dawn", "avatar": "gu_bowl", "speaker": "narr", "name": "", "text": "两人就着灶边对坐。粥无味，却暖。窗外雨停薄光，像把昨夜从门缝里轻轻抽走。", "next": "d08", "day": "次日", "id": "d07", "scene": "破祠·内·拂晓", "speaker_label": "旁白", "is_choice": false, "emotion": "递物", "shot": "近景", "sprite": "gu_bowl", "time_of_day": "day", "present": ["顾山"]}, "d08": {"bg": "bg_hut_dawn", "avatar": "xie_sit", "speaker": "xie", "name": "谢知年", "text": "这山……你一个人多久了？", "next": "d09", "day": "次日", "id": "d08", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "day", "present": ["谢知年"]}, "d09": {"bg": "bg_hut_dawn", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "几年。", "next": "d10", "day": "次日", "id": "d09", "scene": "破祠·内·拂晓", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "d10": {"bg": "bg_hut_dawn", "avatar": "xie_sit", "speaker": "xie", "name": "谢知年", "text": "不闷吗？", "next": "d11", "day": "次日", "id": "d10", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "day", "present": ["谢知年"]}, "d11": {"bg": "bg_hut_dawn", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "山不说话。", "next": "d12", "day": "次日", "id": "d11", "scene": "破祠·内·拂晓", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "d12": {"bg": "bg_hut_dawn", "avatar": "xie_awake", "speaker": "thought", "name": "谢知年", "text": "山不说话。所以他也不必。我忽然笑了一下，笑完又觉得不妥——可他没有责备，只把粥碗又往我这边推了推。", "next": "d13", "delta": {"信": 1, "心": 1}, "day": "次日", "id": "d12", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "d13": {"bg": "bg_hut_dawn", "avatar": "gu_soft", "speaker": "xie", "name": "谢知年", "text": "我出城时，身子已经不行了。城里人说我是[[病壳]]……你不觉得怪？", "next": "d14", "day": "次日", "id": "d13", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "微软", "shot": "近景", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "d14": {"bg": "bg_hut_dawn", "avatar": "gu_soft", "speaker": "gu", "name": "顾山", "text": "壳也是命。", "next": "d15", "day": "次日", "id": "d14", "scene": "破祠·内·拂晓", "speaker_label": "顾山", "is_choice": false, "emotion": "微软", "shot": "近景", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "d15": {"bg": "bg_hut_dawn", "avatar": "xie_sit", "speaker": "thought", "name": "谢知年", "text": "他居然不惊讶。像听过太多次类似的词，又像根本不在乎名目——只在乎你还热不热。", "next": "d16", "day": "次日", "id": "d15", "scene": "破祠·内·拂晓", "speaker_label": "谢知年", "is_choice": false, "emotion": "倚坐", "shot": "近景", "sprite": "xie_sit", "time_of_day": "day", "present": ["谢知年"]}, "d16": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "narr", "name": "", "text": "近午。他靠在门框上，肩线被薄光切出一层浅边。我坐在铺上望他——不是打量猎物，是第一次，认真地看一个肯让你活过一夜的人。", "next": "d17", "day": "次日", "id": "d16", "scene": "破祠·门框", "speaker_label": "旁白", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "d17": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "xie", "name": "谢知年", "text": "顾山。我……有些事记不清。城，雨，还有[[天缝]]那道光。", "next": "choice_share", "day": "次日", "id": "d17", "scene": "破祠·门框", "speaker_label": "谢知年", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "choice_share": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "thought", "name": "谢知年", "text": "要不要把碎片交给他？", "day": "次日", "choices": [{"text": "分享一段模糊记忆（出城前的火与钟声）", "next": "share_mem", "delta": {"魂": 1, "信": 1}}, {"text": "沉默。只说「等我想起来再讲」", "next": "share_quiet", "delta": {"心": 1}}, {"text": "反问：「你捡人，是第一次吗？」", "next": "share_ask", "delta": {"心": 1, "信": 1}}], "id": "choice_share", "scene": "破祠·门框", "speaker_label": "谢知年", "is_choice": true, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "share_mem": {"bg": "cg_window", "avatar": "xie_awake", "speaker": "xie", "name": "谢知年", "text": "出城前听见钟。火光很高。有人喊「别回头」。再之后……就是雨，和你。", "next": "share_res", "day": "次日", "id": "share_mem", "scene": "破祠·门框", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "特写", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "share_quiet": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "不急。", "next": "share_res", "day": "次日", "id": "share_quiet", "scene": "破祠·门框", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "share_ask": {"bg": "cg_window", "avatar": "gu_soft", "speaker": "gu", "name": "顾山", "text": "不算。", "next": "share_res2", "day": "次日", "id": "share_ask", "scene": "破祠·门框", "speaker_label": "顾山", "is_choice": false, "emotion": "微软", "shot": "特写", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "share_res": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "thought", "name": "谢知年", "text": "他听完，只点一下头。不追问，不安慰。像把你的碎片收进猎囊——先装着，以后再理。", "next": "d18", "day": "次日", "id": "share_res", "scene": "破祠·门框", "speaker_label": "谢知年", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "share_res2": {"bg": "cg_window", "avatar": "gu_soft", "speaker": "thought", "name": "谢知年", "text": "「不算。」意味着有过。他没有展开。我也不逼。有些距离，是靠「不问」拉近的。", "next": "d18", "day": "次日", "id": "share_res2", "scene": "破祠·门框", "speaker_label": "谢知年", "is_choice": false, "emotion": "微软", "shot": "特写", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "d18": {"bg": "cg_window", "avatar": "gu_idle", "speaker": "narr", "name": "", "text": "午后光斜。两人之间多了一点不必解释的空隙。你忽然明白：救助可以一夜结束，相处却要从次日的粥和门框开始。", "next": "choice_eve", "delta": {"心": 1}, "day": "次日", "id": "d18", "scene": "破祠·门框", "speaker_label": "旁白", "is_choice": false, "emotion": "平静", "shot": "特写", "sprite": "gu_idle", "time_of_ : "br_a6", "delta": {"信": 1}, "day": "次日", "id": "br_a5", "scene": "山径·脚印", "speaker_label": "谢知年", "is_choice": false, "emotion": "清醒", "shot": "近景", "sprite": "xie_awake", "time_of_day": "day", "present": ["谢知年"]}, "br_a6": {"bg": "bg_mud_path", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "看过了。回。", "next": "br_a7", "day": "次日", "id": "br_a6", "scene": "山径·脚印", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "br_a7": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "narr", "name": "", "text": "回窝棚时暮色压下来。他把门闩好，添柴。我手指还在抖，他丢来一块干布：「擦。」", "next": "br_a8", "day": "次日", "id": "br_a7", "scene": "破祠·内·灶火", "speaker_label": "旁白", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "br_a8": {"bg": "bg_hut_fire", "avatar": "gu_soft", "speaker": "xie", "name": "谢知年", "text": "谢谢你愿意让我看。", "next": "br_a9", "day": "次日", "id": "br_a8", "scene": "破祠·内·灶火", "speaker_label": "谢知年", "is_choice": false, "emotion": "微软", "shot": "近景", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "br_a9": {"bg": "bg_hut_fire", "avatar": "gu_soft", "speaker": "gu", "name": "顾山", "text": "算你活了。", "next": "end_a", "day": "次日", "id": "br_a9", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "微软", "shot": "近景", "sprite": "gu_soft", "time_of_day": "day", "present": ["顾山"]}, "end_a": {"bg": "bg_hut_fire", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "明日再说。", "next": "ending", "day": "次日", "ending": {"title": "雨后脚印", "body": "你跟着他看过山边的痕迹。信任换来危险的轮廓，也换来一句「明日再说」。第一章未在救助处停笔——山里还有未解的脚印，而他已把你算进「明日」。"}, "id": "end_a", "scene": "破祠·内·灶火", "speaker_label": "顾山", "is_choice": false, "emotion": "平静", "shot": "近景", "sprite": "gu_idle", "time_of_day": "day", "present": ["顾山"]}, "br_b1": {"bg": "bg_hut_day", "avatar": "gu_idle", "speaker": "gu", "name": "顾山", "text": "可以。", "next": "br_b2", "day": "次日 const CARD_R = "gu_r_longshangyan";
const CARD_SR = "gu_sr_yusuogui";
const CARD_UR = "gu_ur_xinghedu";
const UR_ENDING_TITLES = ["雨后脚印", "看火与祠", "一声「嗯」"];
const AV_R = "gu_avatar_r";
const AV_SR = "gu_avatar_sr";
const AV_UR = "gu_avatar_ur";
let unlockToastTimer = null;

function ensureUnlocks(st){
  if(!st || typeof st !== "object") st = {};
  if(!st.unlocks || typeof st.unlocks !== "object") st.unlocks = {};
  if(!Array.isArray(st.unlocks.cards)) st.unlocks.cards = [];
  if(!Array.isArray(st.unlocks.avatars)) st.unlocks.avatars = [];
  // migrate: chapter1Done → R; bestAff>=20 → SR; endingsSeen shape
  if(!st.endingsSeen || typeof st.endingsSeen !== "object") st.endingsSeen = {};
  if(st.chapter1Done){
    if(!st.unlocks.cards.includes(CARD_R)) st.unlocks.cards.push(CARD_R);
    if(!st.unlocks.avatars.includes(AV_R)) st.unlocks.avatars.push(AV_R);
  }
  if((st.bestAff||0) >= 20){
    if(!st.unlocks.cards.includes(CARD_SR)) st.unlocks.cards.push(CARD_SR);
    if(!st.unlocks.avatars.includes(AV_SR)) st.unlocks.avatars.push(AV_SR);
  }
  // migrate: UR card / conditions → avatar 星河渡
  if(urConditionsMet(st) || st.unlocks.cards.includes(CARD_UR)){
    if(!st.unlocks.avatars.includes(AV_UR)) st.unlocks.avatars.push(AV_UR);
  }
  return st;
}
function urConditionsMet(st){
  if(!st || typeof st !== "object") return false;
  const seen = st.endingsSeen || {};
  if(!UR_ENDING_TITLES.every(t => !!seen[t])) return false;
  return (st.bestAff||0) >= 20;
}
/** Unlock gallery card only. Toast when newly unlocked and toastTitle given. */
function unlockCard(cardId, toastTitle){
  const st = ensureUnlocks(loadStore());
  if(!cardId || st.unlocks.cards.includes(cardId)) return false;
  st.unlocks.cards.push(cardId);
  saveStore(st);
  if(toastTitle) showUnlockToast(toastTitle);
  return true;
}
function checkUrUnlock(silent){
  const st = ensureUnlocks(loadStore());
  if(!urConditionsMet(st)) return false;
  // migrate: card unlocked earlier without avatar
  if(st.unlocks.cards.includes(CARD_UR) && !st.unlocks.avatars.includes(AV_UR)){
    st.unlocks.avatars.push(AV_UR); saveStore(st);
    return true;
  }
  if(st.unlocks.cards.includes(CARD_UR) && st.unlocks.avatars.includes(AV_UR)) return false;
  if(silent){
    // silent: grant both without toast
    let newly=false;
    if(!st.unlocks.cards.includes(CARD_UR)){ st.unlocks.cards.push(CARD_UR); newly=true; }
    if(!st.unlocks.avatars.includes(AV_UR)){ st.unlocks.avatars.push(AV_UR); newly=true; }
    if(newly) saveStore(st);
    return newly;
  }
  return unlockReward(CARD_UR, AV_UR, "星河渡");
}
function isCardUnlocked(card){
  if(!card) return false;
  if(card.unlocked) return true;
  const st = ensureUnlocks(loadStore());
  return st.unlocks.cards.includes(card.id);
}
function isAvatarUnlocked(id){
  const st = ensureUnlocks(loadStore());
  return st.unlocks.avatars.includes(id);
}
function showUnlockToast(title, sub){
  const el = $("unlockToast"); if(!el) return;
  el.innerHTML = title + (sub ? `<span class="ut-sub">${sub}</span>` : "");
  el.classList.add("show");
  clearTimeout(unlockToastTimer);
  unlockToastTimer = setTimeout(()=>el.classList.remove("show"), 2800);
}
/** Unlock card+avatar; toast only when newly unlocked. Returns true if anything new. */
function unlockReward(cardId, avatarId, label){
  const st = ensureUnlocks(loadStore());
  let newly = false;
  if(cardId && !st.unlocks.cards.includes(cardId)){
    st.unlocks.cards.push(cardId); newly = true;
  }
  if(avatarId && !st.unlocks.avatars.includes(avatarId)){
    st.unlocks.avatars.push(avatarId); newly = true;
  }
  saveStore(st);
  if(newly){
    showUnlockToast("解锁 · " + (label||"心迹"), avatarId ? "卡面 + 头像" : "卡面");
  }
  return newly;
}
function checkSrUnlock(){
  const st = ensureUnlocks(loadStore());
  if((st.bestAff||0) < 20) return false;
  return unlockReward(CARD_SR, AV_SR, "顾山·雨蓑归 / 雨夜");
}
function unlockChapterClear(){
  unlockReward(CARD_R, AV_R, "顾山·垄上烟 / 猎户");
  checkSrUnlock();
}

  const st = ensureUnlocks(loadStore());
  if(id && !st.unlocks.avatars.includes(id)) return;

function updateHomeAvatarBadge(){
  const el = $("homeAvatarBadge"); if(!el) return;
  const st = ensureUnlocks(loadStore());

  if(id && st.unlocks.avatars.includes(id)){

function renderGalleryAvatars(){
  const row = $("galAvatars"); if(!row) return;
  const st = ensureUnlocks(loadStore());

  AVATARS.forEach(av=>{

    btn.type = "button";

    if(unlocked) btn.style.backgroundImage = `url("${imgUrl(av.image)}")`;

    if(unlocked){
      btn.addEventListener("click", ()=>{
        setHomeAvatar(st.homeAvatar===av.id ? null : av.id);
      });
    }
    const lab = document.createElement("div");
    lab.className = "gal-av-label";
    lab.textContent = unlocked ? av.name : "？？？";
    wrap.appendChild(btn); wrap.appendChild(lab);
    row.appendChild(wrap);
  });
}
window.__tfpUnlockTest = function(mode){
  const st = ensureUnlocks(loadStore());
  if(mode==="r" || mode==="all"){
    st.chapter1Done = true;
    saveStore(st);
    unlockChapterClear();
  }
  if(mode==="sr" || mode==="all"){
    st.bestAff = Math.max(st.bestAff||0, 20);
    saveStore(st);
    checkSrUnlock();
  }
  if(mode==="ur" || mode==="all"){
    st.endingsSeen = {"雨后脚印": true, "看火与祠": true, "一声「嗯」": true};
    st.bestAff = Math.max(st.bestAff||0, 20);
    saveStore(st);
    checkUrUnlock();
    // ensure UR avatar present (checkUrUnlock grants via unlockReward / migrate)
    const st2 = ensureUnlocks(loadStore());
    if(!st2.unlocks.avatars.includes(AV_UR)){
      st2.unlocks.avatars.push(AV_UR);
      saveStore(st2);
    }
  }
  if(mode==="reset"){
    st.unlocks = {cards:[], avatars:[]};
    st.homeAvatar = null;
    st.endingsSeen = {};
    saveStore(st);
  }
  renderGallery();
  renderGalleryAvatars();
  updateHomeAvatarBadge();
  return ensureUnlocks(loadStore());
};

function spawnRipple(el, ev){
  const r=document.createElement("span"); r.className="ripple";
  const rect=el.getBoundingClientRect();
  const x=(ev.clientX||rect.left+rect.width/2)-rect.left;
  const y=(ev.clientY||rect.top+rect.height/2)-rect.top;
  const size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+"px";
  r.style.left=(x-size/2)+"px"; r.style.top=(y-size/2)+"px";
  el.appendChild(r); setTimeout(()=>r.remove(),560);
}

function probeVideoSrc(){
  return new Promise(resolve=>{
    const candidates = FERRY_VIDEO_CANDIDATES.map(fn=>{ try{return fn();}catch(e){return null;} }).filter(Boolean);
    let i = 0;
    function tryNext(){
      if(i >= candidates.length){ resolve(null); return; }
      const src = candidates[i++];
      const v = document.createElement("video");
      v.preload = "metadata";
      v.muted = true;
      let done = false;
      const cleanup = ()=>{ v.removeAttribute("src"); try{v.load();}catch(e){} };
      const fail = ()=>{
        if(done) return;
        done = true;
        clearTimeout(to);
        cleanup();
        tryNext();
      };
      const ok = ()=>{
        if(done) return;
        done = true;
        clearTimeout(to);
        cleanup();
        resolve(src);
      };
      const to = setTimeout(fail, 1600);
      v.addEventListener("loadeddata", ok, {once:true});
      v.addEventListener("error", fail, {once:true});
      v.src = src;
      try{ v.load(); }catch(e){ fail(); }
    }
    tryNext();
  });
}

  };
  if(img.getAttribute("src") === url){
    apply();
    return;
  }
  // crossfade: fade out, swap, fade in
  img.classList.remove("visible");
  cinemaLater(()=>{
    img.onload = ()=>{ img.onload = null; apply(); };
    img.src = url;
    if(img.complete){ img.onload = null; apply(); }
  }, 200);
}
function hideTheaterSprites(){
  const sc = $("sceneChar"), av = $("avatarFloat");
  if(sc){ sc.classList.remove("show","cam-zoom"); sc.style.backgroundImage=""; }

function onCinemaClick(e){
  if(e) e.stopPropagation();
  if(!cinemaActive) return;
  if(cinemaPhase === 1) cinemaGoMedium();
  else if(cinemaPhase === 2) cinemaGoClose();
  // phase 3 waits for video timer; phase 4 locked
}
function bindCinemaClick(on){
  const layer = $("cinema-layer");
  if(!layer) return;
  if(on && !cinemaClickBound){
    layer.addEventListener("click", onCinemaClick);
    cinemaClickBound = true;
  } else if(!on && cinemaClickBound){
    layer.removeEventListener("click", onCinemaClick);
    cinemaClickBound = false;
  }
}
function cinemaGoWide(){
  cinemaPhase = 1;
  const layer = $("cinema-layer");
  const vid = $("cinema-video");
  const vig = layer.querySelector(".cinema-vignette");
  document.body.classList.add("cinema-lock");
  hideTheaterSprites();
  hideChoices();
  clearType();
  $("dialogueText").innerHTML = "";
  $("tapHint").style.display = "none";
  if(vid){ vid.pause(); vid.removeAttribute("src"); vid.classList.remove("visible"); try{vid.load();}catch(e){} }
  if(vig) vig.classList.remove("on");
  layer.hidden = false;
  layer.setAttribute("aria-hidden","false");
  layer.classList.remove("video-lock");
  setCinemaImg("cg_ferry_1", "zoom05");
  // fade in
  requestAnimationFrame(()=> layer.classList.add("show"));
  bindCinemaClick(true);
}
function cinemaGoMedium(){
  if(cinemaPhase !== 1) return;
  cinemaPhase = 2;
  const img = $("cinema-img");
  img.classList.remove("zoom05");
  setCinemaImg("cg_ferry_2", "breath");
}
function cinemaGoClose(){
  if(cinemaPhase !== 2) return;
  cinemaPhase = 3;
  const layer = $("cinema-layer");
  const vig = layer.querySelector(".cinema-vignette");
  const img = $("cinema-img");
  img.classList.remove("breath");
  setCinemaImg("cg_ferry_3", "zoom11");
  if(vig) vig.classList.add("on");
  // ~2s after close → try video
  cinemaLater(()=> cinemaGoVideo(), 2000);
}
async function cinemaGoVideo(){
  if(cinemaPhase !== 3) return;
  cinemaPhase = 4;
  const layer = $("cinema-layer");
  const img = $("cinema-img");
  const vid = $("cinema-video");
  layer.classList.add("video-lock");
  bindCinemaClick(false);

  const src = await probeVideoSrc();
  if(!src || !vid){
    // missing / error: hold close + zoom another ~3s then end
    cinemaLater(()=> cinemaAftermath(), 3000);
    return;
  }
  let settled = false;
  const failToStill = ()=>{
    if(settled) return;
    settled = true;
    vid.classList.remove("visible");
    img.classList.add("visible");
    cinemaLater(()=> cinemaAftermath(), 3000);
  };
  vid.onended = ()=>{
    if(settled) return;
    settled = true;
    cinemaAftermath();
  };
  vid.onerror = failToStill;
  try{
    vid.src = src;
    vid.currentTime = 0;
    vid.classList.add("visible");
    // keep still under video briefly
    const p = vid.play();
    if(p && typeof p.then === "function"){
      p.then(()=>{ /* playing */ }).catch(failToStill);
    }
  }catch(e){
    failToStill();
  }
}
function cinemaAftermath(){
  if(cinemaPhase === 5) return;
  cinemaPhase = 5;
  cinemaClearTimers();
  bindCinemaClick(false);
  const layer = $("cinema-layer");
  const img = $("cinema-img");
  const vid = $("cinema-video");
  const vig = layer && layer.querySelector(".cinema-vignette");
  if(vid){
    try{ vid.pause(); }catch(e){}
    vid.onended = null; vid.onerror = null;
    vid.classList.remove("visible");
    vid.removeAttribute("src");
    try{ vid.load(); }catch(e){}
  }
  if(img) img.classList.remove("visible","zoom05","zoom11","breath");
  if(vig) vig.classList.remove("on");
  if(layer){
    layer.classList.remove("show","video-lock");
  }
  // fade out then restore
  cinemaLater(()=>{
    if(layer){
      layer.hidden = true;
      layer.setAttribute("aria-hidden","true");
    }
    document.body.classList.remove("cinema-lock");
    $("tapHint").style.display = "";
    cinemaActive = false;
    cinemaPhase = 0;
    goNode("n15");
  }, 1600);
}
function playFerryCinema(){
  if(cinemaActive) return;
  cinemaActive = true;
  cinemaClearTimers();
  preloadFerryStills();
  // apply n14 deltas once at start (goNode already applied if routed through it)
  cinemaGoWide();
}


function clearType(){
  if(state.typeTimer){ clearTimeout(state.typeTimer); state.typeTimer=null; }
  state.typing=false;
}
function renderLoreSpans(raw){
  const re=/\[\[(.+?)\]\]/g;
  let plain=raw.replace(re,"$1");
  let html=raw.replace(re,(_,w)=>`<span class="lore" data-lore="${w}">${w}</span>`);
  return {html, plain};
}
function typeText(raw, onDone){
  clearType();
  const box=$("dialogueText");
  const {html, plain}=renderLoreSpans(raw);
  state.fullText=plain; state.fullHtml=html; state.typeIdx=0; state.typing=true;
  box.innerHTML=""; $("tapHint").style.opacity="0.35";
  const chars=Array.from(plain);
  function step(){
    if(!state.typing) return;
    state.typeIdx++;
    let display=plain.slice(0, state.typeIdx);
    for(const key of Object.keys(LORE)){
      if(display.includes(key)) display=display.split(key).join(`<span class="lore" data-lore="${key}">${key}</span>`);
    }
    box.innerHTML=display;
    if(state.typeIdx>=chars.length){
      state.typing=false; box.innerHTML=html; bindLoreClicks(box);
      $("tapHint").style.opacity=""; if(onDone) onDone(); return;
    }
    const ch=chars[state.typeIdx-1];
    let delay=24;
    if("，、；：".includes(ch)) delay=100;
    else if("。！？…".includes(ch)) delay=180;
    else if(ch==="\n") delay=120;
    state.typeTimer=setTimeout(step, delay);
  }
  step();
}
function completeType(){
  if(!state.typing) return;
  clearType();
  const box=$("dialogueText");
  box.innerHTML=state.fullHtml||state.fullText;
  bindLoreClicks(box); $("tapHint").style.opacity="";
}
function bindLoreClicks(root){
  root.querySelectorAll(".lore").forEach(el=>{
    el.addEventListener("click", e=>{ e.stopPropagation(); openLore(el.dataset.lore); });
  });
}
function openLore(key){
  const body=LORE[key]; if(!body) return;
  $("tipTitle").textContent="何谓此句 · "+key;
  $("tipBody").textContent=body;
  $("tooltipMask").classList.add("show");
}

function bgFitMode(key){
  if(!key) return "cover";
  // Ferry cinema / UR still: show full frame
  if(String(key).startsWith("cg_ferry")) return "contain";
  return "cover"; // landscape stage fill
}

/** Dialog circle: prefer unlocked square gu_avatar_* ; else sprite with face-bias CSS. */
function dialogueAvatarUrl(node){
  const sp = node.sprite || node.avatar;
  if(!sp) return null;
  const st = ensureUnlocks(loadStore());
  if(String(sp).startsWith("gu_") || node.name==="顾山" || node.speaker==="gu"){
    const order = ["gu_avatar_ur","gu_avatar_sr","gu_avatar_r"];
    for(const id of order){
      if(st.unlocks.avatars.includes(id) && IMG[id]) return { url: imgUrl(id), kind: "square" };
    }
  }
  // Xie or locked Gu: vertical sprite + av-sprite face crop
  return { url: imgUrl(sp), kind: "sprite" };
}

function setScene(node){
  const bg=$("sceneBg"), fx=$("sceneFx"), mask=$("sceneMask");
  const nextUrl=imgUrl(node.bg);
  const isCg=node.bg && String(node.bg).startsWith("cg_");
  const fit=bgFitMode(node.bg);
  bg.classList.toggle("fit-contain", fit==="contain");
  bg.classList.toggle("fit-cover", fit==="cover");
  /* fade bg change ~200–400ms */
  bg.style.opacity="0";
  setTimeout(()=>{ bg.style.backgroundImage=`url("${nextUrl}")`; bg.style.opacity="1"; }, 220);
  bg.classList.remove("dim","zoom"); fx.classList.remove("pass-glow");
  if(mask) mask.classList.toggle("show", !!(node.sprite||node.avatar) && !isCg);
  if(node.effect==="pass"){ bg.classList.add("dim","zoom"); fx.classList.add("pass-glow"); }
  $("dayTag").textContent=node.day||"第一夜";
  const av=$("avatarFloat"), sc=$("sceneChar");
  const sprite=node.sprite||node.avatar;
  /* always clear previous large sprite / classes before applying */
  sc.classList.remove("show","pos-right","pos-center","cam-zoom");
  sc.style.backgroundImage="";
  if(sprite && !isCg && String(sprite).startsWith("gu_")){
    sc.style.backgroundImage=`url("${imgUrl(sprite)}")`; sc.classList.add("show");
    // 稀有度立绘位：R/SR 偏右，SSR 居中；普通表情居中
    if(sprite==="gu_r"||sprite==="gu_sr") sc.classList.add("pos-right");
    else if(sprite==="gu_ssr") sc.classList.add("pos-center");
    else sc.classList.add("pos-center");
  }
  /* CG: full-bleed bg only — large scene-char cleared above; small avatar: square avatars/ preferred */
  av.classList.remove("av-square","av-sprite");
  const avInfo = dialogueAvatarUrl(node);
  if(avInfo && avInfo.url){
    av.style.backgroundImage=`url("${avInfo.url}")`;
    av.classList.add("show", avInfo.kind==="square" ? "av-square" : "av-sprite");
  } else {
    av.classList.remove("show"); av.style.backgroundImage="";
  }
  // 特写推进镜头（CG 时不推立绘）
  cameraZoom(!isCg && node.shot==="特写");
  const np=$("nameplate"), sn=$("speakerName"), dt=$("dialogueText");
  if(node.speaker==="narr" || !node.name){ np.style.display="none"; dt.classList.remove("thought"); }
  else { np.style.display="flex"; sn.textContent=node.name; dt.classList.toggle("thought", node.speaker==="thought"); }
  $("dialogueBox").classList.toggle("alt", node.time_of_day==="day");
}

function showChoices(choices){
  state.choiceMode=true;
  const box=$("choices"); box.innerHTML="";
  choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="choice-btn"; btn.textContent=c.text;
    btn.addEventListener("click", e=>{
      e.stopPropagation(); applyDelta(c.delta);
      state.choiceMode=false; box.classList.remove("show"); box.innerHTML="";
      goNode(c.next);
    });
    box.appendChild(btn);
  });
  box.classList.add("show"); $("tapHint").style.display="none";
}
function hideChoices(){
  state.choiceMode=false;
  $("choices").classList.remove("show"); $("choices").innerHTML="";

}
function goNode(id){
  const node=NODES[id]; if(!node) return;
  state.nodeId=id; hideChoices(); $("endingCard").classList.remove("show");
  if(node.isEnd){ showEnding(); return; }
  // Ferry cinema: replace n14 dialogue with immersive CG sequence
  if(id==="n14" || node.effect==="ferry_cinema"){
    applyDelta(node.delta);
    playFerryCinema();
    return;
  }
  applyDelta(node.delta); setScene(node);
  if(id==="n12" || id==="n13") preloadFerryStills();
  if(node.ending) state.pendingEnding=node.ending;
  typeText(node.text, ()=>{ if(node.choices) showChoices(node.choices); });
}
function advance(){
  if(cinemaActive) return;
  if(state.ended||state.choiceMode) return;
  if($("tooltipMask").classList.contains("show")) return;
  if(state.typing){
    completeType();
    const node=NODES[state.nodeId];
    if(node && node.choices) showChoices(node.choices);
    return;
  }
  const node=NODES[state.nodeId];
  if(!node||node.choices) return;
  if(node.next) goNode(node.next);
}
function showEnding(){
  state.ended=true;
  const end=state.pendingEnding||{title:"雨夜破祠",body:"第一章终。"};
  $("endingTitle").textContent=end.title;
  $("endingBody").textContent=end.body;
  $("endingCard").classList.add("show");
  const st=ensureUnlocks(loadStore());
  st.chapter1Done=true; st.endingTitle=end.title;
  if(!st.endingsSeen || typeof st.endingsSeen !== "object") st.endingsSeen = {};
  if(end.title) st.endingsSeen[end.title] = true;
  st.bestAff=Math.max(st.bestAff||0,(state.vars.心||0)+(state.vars.信||0));
  saveStore(st);
  checkUrUnlock();
  unlockChapterClear();
  updateAffinity();
}
function startChapter(startId){
  state.vars={壳:1,魂:0,信:0,心:0};
  state.ended=false; state.pendingEnding=null;
  cinemaActive=false; cinemaPhase=0; cinemaClearTimers();

  updateStats(); showScreen("theater"); goNode(startId||"n01");
}

function hlBgKey(hm){
  if(hm.tod==="day"){
    if(hm.fire>=3) return "bg_hut_day";
    return hm.raining ? "bg_hut_rain_window" : "bg_hut_dawn";
  }
  if(hm.fire>=3) return "bg_hut_fire";
  if(hm.fire>=1) return "bg_hut_embers";
  return hm.raining ? "bg_shrine_rain" : "bg_hut_embers";
}
function renderHomeland(){
  const hm=loadHome();
  setBgEl($("hlBg"), hlBgKey(hm));
  const ch=$("hlChar");
  if(hm.present){
    ch.classList.remove("away");
    setBgEl(ch, hm.fire>=2 ? "gu_idle" : "gu_mend");
  } else ch.classList.add("away");
  const labels=[
    ["整洁", hm.tidy], ["烟火", hm.fire], ["雨湿", hm.wet],
    ["时辰", hm.tod==="day"?"昼":"夜"],
    ["顾山", hm.present?"在场":"离场"]
  ];
  $("hlStats").innerHTML=labels.map(([k,v])=>`<div class="hl-pill">${k} <span>${v}</span></div>`).join("");
  $("actDoor").disabled = !(hm.raining || hm.wet>0);
  $("actWood").disabled = false;
  $("actWater").disabled = false;
  $("actBed").disabled = false;
}
function showHlLine(text){
  const el=$("hlLine"); el.textContent=text; el.classList.add("show");
  clearTimeout(hlLineTimer);
  hlLineTimer=setTimeout(()=>el.classList.remove("show"), 2200);
}
function doHomeAct(act){
  const hm=loadHome();
  if(act==="wood"){ hm.fire=Math.min(5, hm.fire+1); hm.wet=Math.max(0, hm.wet-1); }
  if(act==="water"){ hm.tidy=Math.min(5, hm.tidy+1); }
  if(act==="tidy"){ hm.tidy=Math.min(5, hm.tidy+1); }
  if(act==="door"){
    if(!(hm.raining||hm.wet>0)) return;
    hm.wet=Math.max(0, hm.wet-2); hm.raining=hm.wet>0 ? hm.raining : false;
  }
  hm.updatedAt=Date.now();
  // occasional leave after actions at day
  if(hm.present && hm.tod==="day" && Math.random()<0.12){ hm.present=false; }
  else if(!hm.present && Math.random()<0.25){ hm.present=true; }
  saveHome(hm); renderHomeland();
  if(hm.present) showHlLine(PRESENT_LINES[Math.floor(Math.random()*PRESENT_LINES.length)]);
  else showHlLine(AWAY_NOTES[Math.floor(Math.random()*AWAY_NOTES.length)]);
}
function onSpot(spot){
  const hm=loadHome();
  const map={bed:"tidy", altar:"water", stove:"wood", door:"door"};
  const act=map[spot]; if(!act) return;
  if(act==="door" && !(hm.raining||hm.wet>0)){ showHlLine(hm.present?"门已关。":"门闩好了。"); return; }
  doHomeAct(act);
}

const AWAY_BEATS=[
  {when:"你离开之后", img:"gu_idle", text:"他把碗洗了，水倒进门外的石槽。雨丝斜过屋檐，他在门槛上坐了一会儿，没有点第二盏灯。"},
  {when:"入夜稍深", img:"gu_worry", text:"山路上传来一下极轻的踏响。他起身，把门闩好，回屋时在你常坐的那侧多添了一块干柴。"},
  {when:"近卯时", img:"gu_mend", text:"猎网又理过一遍。他尝了一口药罐，皱了皱眉，却仍把火调小。窗外天缝那道光淡了些。他说了句谁也没听见的话：先活。"}
];
function checkAwayOnOpen(){
  const st=loadStore(); const now=Date.now(); const last=st.lastVisit||now;
  const gap=now-last; st.lastVisit=now;
  if(gap>=5*60*1000){ st.pendingAway=true; st.awayGeneratedAt=now; }
  saveStore(st); return !!st.pendingAway;
}
function forceAway(){
  const st=loadStore(); st.pendingAway=true; st.lastVisit=Date.now()-6*60*1000;
  saveStore(st); renderAway(); showScreen("away");
}
function renderAway(){
  const scroll=$("awayScroll"); const st=loadStore();
  if(!st.pendingAway && !st.awaySeen){
    scroll.innerHTML=`<div class="away-empty">他这阵子都在。<br>你若离开片刻再回来，<br>或许能看见他独自做过的事。</div>`;
    return;
  }
  if(st.pendingAway){ st.awaySeen=true; st.pendingAway=false; saveStore(st); }
  scroll.innerHTML="";
  AWAY_BEATS.forEach(b=>{
    const el=document.createElement("div"); el.className="away-beat";
    el.innerHTML=`<div class="illust" style="background-image:url('${imgUrl(b.img)}')"></div>
      <div class="body"><div class="when">${b.when}</div><div>${b.text}</div></div>`;
    scroll.appendChild(el);
  });
}

function onHomeZone(zone){
  const lines=ZONE_LINES[zone]||HOME_LINES;
  const line=lines[Math.floor(Math.random()*lines.length)];
  const bubble=$("homeBubble"), char=$("homeChar");
  bubble.textContent=line; bubble.classList.add("show"); char.classList.add("react");
  const btn=document.querySelector(`.hotzone[data-zone="${zone}"]`);
  if(btn){ btn.classList.add("flash"); setTimeout(()=>btn.classList.remove("flash"), 400); }
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>{ bubble.classList.remove("show"); char.classList.remove("react"); }, 2000);
}

function initHome(){
  const hm=loadHome();
  setBgEl($("homeBg"), hlBgKey(hm));
  setBgEl($("homeChar"), "gu_idle");
  // landscape stage: contain + bottom-align companion sprite
  $("homeChar").style.backgroundSize="contain";
  $("homeChar").style.backgroundPosition="center bottom";
  $("homeMood").textContent=homeMoodLine();
  $("homeStateLabel").textContent=homeStateLine();
  checkAwayOnOpen(); updateAffinity();
  updateHomeAvatarBadge();
}

$("btnTheaterBack").addEventListener("click", ()=>{
  if(cinemaActive){
    cinemaClearTimers(); bindCinemaClick(false);
    const layer=$("cinema-layer"), vid=$("cinema-video"), img=$("cinema-img");
    if(vid){ try{vid.pause();}catch(e){} vid.onended=null; vid.onerror=null; vid.removeAttribute("src"); try{vid.load();}catch(e){} vid.classList.remove("visible"); }
    if(img) img.classList.remove("visible","zoom05","zoom11","breath");
    if(layer){ layer.classList.remove("show","video-lock"); layer.hidden=true; layer.setAttribute("aria-hidden","true"); }
    document.body.classList.remove("cinema-lock");
    cinemaActive=false; cinemaPhase=0;
  }
  clearType(); hideChoices(); state.ended=false; initHome(); showScreen("home");
});
