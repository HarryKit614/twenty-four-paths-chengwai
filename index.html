<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>廿四道·城外 — 雨夜破祠</title>
<style>
:root {
  --ink: #1a1612;
  --ink-soft: #2c261f;
  --charcoal: #3a342c;
  --gold: #c9a56a;
  --gold-bright: #e8d5a8;
  --gold-dim: #c9a56a33;
  --gold-edge: #c9a56a88;
  --paper: #f3ebe0;
  --paper-dim: #e8dcc8;
  --frost: rgba(26, 22, 18, 0.55);
  --frost-strong: rgba(22, 18, 14, 0.78);
  --text: #f5efe6;
  --text-dim: #c4b8a4;
  --accent-red: #8b4a3a;
  --fade: 0.45s;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0d0b09;
  color: var(--text);
  font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", "PingFang SC", "Hiragino Mincho ProN", serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
#app {
  width: 100%;
  max-width: 430px;
  height: 100%;
  max-height: 100dvh;
  margin: 0 auto;
  position: relative;
  background: var(--ink);
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.6);
}
.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  opacity: 0; transition: opacity var(--fade) ease; z-index: 1;
}
.screen.active { display: flex; opacity: 1; z-index: 2; }

/* ===== HOME ===== */
#home { background: #0d0b09; }
.home-scene { position: absolute; inset: 0; overflow: hidden; background: #0a0806; }
.home-scene .bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  transform: scale(1.04);
  transition: transform 10s ease;
}
.home-scene .char {
  position: absolute;
  left: 50%; bottom: 16%;
  width: 86%; max-width: 360px;
  height: 68%;
  transform: translateX(-50%);
  background-size: contain;
  background-position: center bottom;
  background-repeat: no-repeat;
  filter: drop-shadow(0 8px 28px rgba(0,0,0,0.5));
  transition: transform 0.35s ease, filter 0.35s ease;
  cursor: pointer;
}
.home-scene .char.react {
  transform: translateX(-50%) scale(1.025);
  filter: drop-shadow(0 8px 32px rgba(201,165,106,0.3));
}
.home-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg,
    rgba(13,11,9,0.45) 0%, transparent 18%,
    transparent 42%, rgba(13,11,9,0.5) 62%,
    rgba(13,11,9,0.94) 100%);
}
.home-top {
  position: relative; z-index: 5;
  padding: calc(18px + var(--safe-t)) 18px 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.home-title-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; letter-spacing: 0.32em; color: var(--gold); opacity: 0.9;
}
.home-title-row .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 8px var(--gold);
}
.home-subtitle { font-size: 11px; letter-spacing: 0.18em; color: var(--text-dim); }
.home-affinity {
  display: flex; gap: 6px; margin-top: 4px;
}
.aff-pip {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1px solid var(--gold-edge);
  background: transparent;
}
.aff-pip.on { background: var(--gold); box-shadow: 0 0 6px rgba(201,165,106,0.55); }
.home-status {
  position: absolute; left: 0; right: 0; bottom: 34%;
  z-index: 5; text-align: center; padding: 0 24px; pointer-events: none;
}
.home-name {
  font-size: 30px; letter-spacing: 0.3em; color: var(--gold-bright);
  text-shadow: 0 2px 18px rgba(0,0,0,0.75); font-weight: 500;
}
.home-mood {
  margin-top: 10px; font-size: 13px; line-height: 1.7;
  color: var(--paper-dim); letter-spacing: 0.08em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.85);
}
.home-status-bubble {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 12px; padding: 5px 12px;
  border-radius: 999px;
  background: rgba(26,22,18,0.55);
  border: 1px solid var(--gold-dim);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 11px; letter-spacing: 0.12em; color: var(--gold-bright);
  pointer-events: auto;
}
.home-status-bubble .pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: #7ec8a0; box-shadow: 0 0 8px #7ec8a0;
  animation: breath 2.4s ease infinite;
}
@keyframes breath {
  0%,100% { opacity: 0.45; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}
.home-nav {
  position: absolute; left: 14px; right: 14px;
  bottom: calc(18px + var(--safe-b));
  z-index: 6; display: flex; gap: 8px;
}
.nav-btn {
  flex: 1; appearance: none;
  border: 1px solid var(--gold-edge);
  background: rgba(26,22,18,0.48);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  color: var(--gold-bright);
  padding: 12px 6px 10px;
  border-radius: 14px;
  font-size: 12px; letter-spacing: 0.12em;
  font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: background 0.25s, transform 0.15s;
}
.nav-btn .ico { font-size: 18px; line-height: 1; opacity: 0.9; }
.nav-btn:active { transform: scale(0.97); background: rgba(201,165,106,0.2); }
.nav-btn.primary {
  background: rgba(201,165,106,0.16);
  border-color: var(--gold);
}
.home-bubble {
  position: absolute; left: 50%; bottom: 44%;
  transform: translateX(-50%) translateY(8px);
  z-index: 8; max-width: 78%; padding: 10px 16px;
  background: rgba(26,22,18,0.82);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--gold-dim); border-radius: 12px;
  font-size: 14px; letter-spacing: 0.06em; color: var(--paper);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.home-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.home-debug {
  position: absolute; top: calc(12px + var(--safe-t)); right: 12px; z-index: 10;
  font-size: 10px; letter-spacing: 0.1em; color: var(--gold); opacity: 0.4;
  background: transparent; border: 1px solid var(--gold-dim);
  border-radius: 8px; padding: 6px 10px; font-family: inherit; cursor: pointer;
}

/* ===== THEATER ===== */
#theater { background: #000; }
.scene-stage { position: absolute; inset: 0; overflow: hidden; background: #0a0806; }
.scene-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  transition: opacity var(--fade) ease, transform 1.2s ease, filter 0.8s ease;
  opacity: 1;
}
.scene-bg.dim { filter: brightness(0.45) saturate(0.7); transform: scale(1.06); }
.scene-bg.zoom { transform: scale(1.1); }
.scene-char {
  position: absolute;
  left: 50%; bottom: 22%;
  width: 78%; max-width: 340px; height: 58%;
  transform: translateX(-50%);
  background-size: contain;
  background-position: center bottom;
  background-repeat: no-repeat;
  opacity: 0; transition: opacity 0.4s;
  pointer-events: none; z-index: 1;
  filter: drop-shadow(0 6px 20px rgba(0,0,0,0.4));
}
.scene-char.show { opacity: 1; }
.scene-fx {
  position: absolute; inset: 0; pointer-events: none;
  background: transparent; transition: background 0.8s ease; z-index: 2;
}
.scene-fx.pass-glow {
  background: radial-gradient(ellipse at center, rgba(201,165,106,0.2) 0%, transparent 65%);
}
.day-tag {
  position: absolute; top: calc(14px + var(--safe-t)); left: 52px; z-index: 22;
  font-size: 10px; letter-spacing: 0.2em;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(26,22,18,0.6); border: 1px solid var(--gold-dim);
  color: var(--gold-bright); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.status-bar {
  position: absolute; top: calc(14px + var(--safe-t)); right: 12px; z-index: 20;
  display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; pointer-events: none;
}
.stat-pill {
  font-size: 10px; letter-spacing: 0.1em; padding: 4px 8px; border-radius: 999px;
  background: rgba(26,22,18,0.55); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--gold-dim); color: var(--gold-bright);
}
.stat-pill span { color: var(--paper); margin-left: 2px; }
.theater-back {
  position: absolute; top: calc(12px + var(--safe-t)); left: 12px; z-index: 25;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--gold-edge);
  background: rgba(26,22,18,0.55); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--gold); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; line-height: 1;
}
.dialogue-layer {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 0 12px calc(12px + var(--safe-b)); pointer-events: none;
}
.dialogue-layer > * { pointer-events: auto; }
.avatar-float {
  position: absolute; left: 16px;
  bottom: calc(168px + var(--safe-b));
  width: 68px; height: 86px; border-radius: 12px;
  border: 1px solid var(--gold-edge);
  background: rgba(26,22,18,0.45);
  background-size: cover; background-position: center top;
  box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.35s, transform 0.35s; overflow: hidden;
}
.avatar-float.show { opacity: 1; transform: translateY(0); }
.dialogue-box {
  position: relative;
  background: var(--frost-strong);
  backdrop-filter: blur(22px) saturate(1.15);
  -webkit-backdrop-filter: blur(22px) saturate(1.15);
  border: 1px solid var(--gold-dim); border-radius: 18px;
  padding: 22px 16px 18px; min-height: 138px;
  box-shadow: 0 -4px 40px rgba(0,0,0,0.4); cursor: pointer;
}
.nameplate {
  position: absolute; top: -13px; left: 14px;
  display: flex; align-items: center; gap: 8px;
}
.nameplate .name {
  background: linear-gradient(135deg, #4a3a28, #2a2218);
  border: 1px solid var(--gold-edge);
  color: var(--gold-bright);
  font-size: 13px; letter-spacing: 0.2em;
  padding: 5px 16px 5px 14px; border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.nameplate .accent {
  width: 3px; height: 18px; background: var(--gold); border-radius: 2px;
  box-shadow: 0 0 10px rgba(201,165,106,0.55);
}
.dialogue-text {
  font-size: 15px; line-height: 1.9; letter-spacing: 0.04em;
  color: var(--paper); min-height: 4.6em; padding-top: 2px;
}
.dialogue-text.thought { color: var(--text-dim); font-style: italic; }
.dialogue-text .lore {
  color: var(--gold-bright); border-bottom: 1px dashed var(--gold-edge);
  cursor: pointer; pointer-events: auto;
}
.tap-hint {
  position: absolute; right: 14px; bottom: 10px;
  font-size: 11px; color: var(--gold); opacity: 0.45;
  letter-spacing: 0.15em; animation: pulse 1.8s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
.choices {
  display: none; flex-direction: column; gap: 10px; margin-top: 12px;
}
.choices.show { display: flex; }
.choice-btn {
  appearance: none; width: 100%;
  border: 1px solid var(--gold-edge);
  background: rgba(26,22,18,0.7);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--gold-bright);
  padding: 15px 16px; border-radius: 14px;
  font-size: 14px; letter-spacing: 0.06em; font-family: inherit;
  cursor: pointer; text-align: left; line-height: 1.55;
  transition: background 0.2s, transform 0.12s;
  box-shadow: inset 0 0 0 1px rgba(201,165,106,0.08), 0 4px 16px rgba(0,0,0,0.25);
}
.choice-btn:active { transform: scale(0.985); background: rgba(201,165,106,0.24); }
.ending-card {
  position: absolute; inset: 0; z-index: 40;
  display: none; align-items: center; justify-content: center;
  background: rgba(8,6,4,0.84); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); padding: 32px;
  opacity: 0; transition: opacity 0.5s;
}
.ending-card.show { display: flex; opacity: 1; }
.ending-inner {
  width: 100%; max-width: 320px;
  border: 1px solid var(--gold-edge); border-radius: 20px;
  background: linear-gradient(160deg, rgba(42,34,24,0.96), rgba(22,18,14,0.97));
  padding: 36px 24px 28px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}
.ending-inner .label { font-size: 11px; letter-spacing: 0.4em; color: var(--gold); margin-bottom: 16px; }
.ending-inner h2 {
  font-size: 22px; letter-spacing: 0.25em; color: var(--gold-bright);
  font-weight: 500; margin-bottom: 18px;
}
.ending-inner p {
  font-size: 13px; line-height: 1.95; color: var(--paper-dim);
  letter-spacing: 0.05em; margin-bottom: 24px; text-align: left;
}
.ending-inner button {
  appearance: none; border: 1px solid var(--gold-edge); background: transparent;
  color: var(--gold-bright); padding: 11px 28px; border-radius: 999px;
  font-family: inherit; font-size: 13px; letter-spacing: 0.2em; cursor: pointer;
}

/* ===== POSTCARD / AWAY ===== */
#postcard, #away, #gallery { background: #12100c; }
.panel-header {
  padding: calc(28px + var(--safe-t)) 22px 12px; text-align: center; position: relative; z-index: 2;
}
.panel-header h1 { font-size: 18px; letter-spacing: 0.28em; color: var(--gold-bright); font-weight: 500; }
.panel-header p { margin-top: 8px; font-size: 12px; color: var(--text-dim); letter-spacing: 0.1em; line-height: 1.7; }
.panel-back {
  position: absolute; left: 16px; top: calc(26px + var(--safe-t));
  border: none; background: transparent; color: var(--gold);
  font-size: 14px; letter-spacing: 0.1em; font-family: inherit; cursor: pointer; padding: 6px 8px;
}
.card-grid {
  flex: 1; overflow-y: auto; padding: 12px 20px 28px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start;
}
.pcard {
  aspect-ratio: 9/16; border-radius: 12px; border: 1px solid var(--gold-dim);
  background: rgba(40,34,28,0.6); overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.pcard.unlocked {
  border-color: var(--gold-edge);
  background-size: cover; background-position: center top;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.pcard .slot-label {
  font-size: 11px; color: var(--text-dim); letter-spacing: 0.12em;
  text-align: center; padding: 8px; opacity: 0.65;
}
.pcard.unlocked .slot-label {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: linear-gradient(transparent, rgba(13,11,9,0.88));
  padding: 24px 8px 12px; color: var(--gold-bright); opacity: 1;
}
.pcard.locked-ch {
  border-style: dashed; flex-direction: column; gap: 8px;
}
.pcard.locked-ch .lock-ico { font-size: 20px; opacity: 0.4; color: var(--gold); }
.away-scroll { flex: 1; overflow-y: auto; padding: 8px 22px 32px; }
.away-beat {
  margin-bottom: 22px; border-radius: 14px; border: 1px solid var(--gold-dim);
  overflow: hidden; background: rgba(26,22,18,0.55);
}
.away-beat .illust {
  height: 200px; background-size: cover; background-position: center top;
}
.away-beat .body {
  padding: 14px 16px 16px; font-size: 13px; line-height: 1.85;
  letter-spacing: 0.05em; color: var(--paper-dim);
}
.away-beat .when { font-size: 11px; color: var(--gold); letter-spacing: 0.15em; margin-bottom: 6px; }
.away-empty {
  text-align: center; padding: 60px 24px; color: var(--text-dim);
  font-size: 13px; letter-spacing: 0.1em; line-height: 1.9;
}

/* ===== GALLERY ===== */
#gallery { background: #0e0c09; }
#gallery::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201,165,106,0.07), transparent 55%),
    linear-gradient(180deg, #12100c 0%, #0a0907 100%);
  opacity: 1;
}
.gal-header {
  padding: calc(28px + var(--safe-t)) 22px 8px; text-align: center; position: relative; z-index: 2;
}
.gal-header h1 { font-size: 18px; letter-spacing: 0.32em; color: var(--gold-bright); font-weight: 500; }
.gal-header .sub { margin-top: 6px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.22em; }
.gal-filters {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  padding: 10px 16px 6px; position: relative; z-index: 2;
}
.gal-chip {
  appearance: none; border: 1px solid var(--gold-dim);
  background: rgba(26,22,18,0.5); color: var(--text-dim);
  padding: 6px 14px; border-radius: 999px;
  font-family: inherit; font-size: 11px; letter-spacing: 0.16em; cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.gal-chip.on {
  background: rgba(201,165,106,0.18); border-color: var(--gold);
  color: var(--gold-bright);
}
.gal-grid {
  flex: 1; overflow-y: auto; padding: 12px 16px calc(28px + var(--safe-b));
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start;
  position: relative; z-index: 2;
}
.gal-card {
  position: relative; aspect-ratio: 9/16; border-radius: 12px;
  overflow: hidden; cursor: pointer;
  background: rgba(30,26,20,0.7);
  border: 1px solid var(--gold-dim);
  transition: transform 0.2s, box-shadow 0.25s;
}
.gal-card:active { transform: scale(0.97); }
.gal-card .thumb {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  background-repeat: no-repeat;
}
.gal-card .thumb.locked {
  filter: brightness(0.12) contrast(1.1);
}
.gal-card .shade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
  background: linear-gradient(transparent, rgba(10,8,6,0.92));
  pointer-events: none;
}
.gal-card .meta {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 10px 12px; z-index: 2;
}
.gal-card .meta .cname {
  font-size: 14px; letter-spacing: 0.18em; color: var(--gold-bright);
}
.gal-card .meta .cname-char {
  margin-top: 3px; font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim);
}
.gal-badge {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  min-width: 28px; padding: 3px 7px; border-radius: 6px;
  font-size: 10px; letter-spacing: 0.08em; text-align: center;
  font-weight: 600; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.gal-badge.R {
  color: #d4b896; border: 1px solid #a67c5233;
  background: rgba(90,60,35,0.55);
  box-shadow: 0 0 0 1px rgba(166,124,82,0.25);
}
.gal-badge.SR {
  color: #c8dce8; border: 1px solid #8aadc633;
  background: rgba(40,60,75,0.6);
  box-shadow: 0 0 10px rgba(140,180,210,0.25);
}
.gal-badge.SSR {
  color: #f0e0b0; border: 1px solid #c9a56a88;
  background: rgba(80,60,25,0.65);
  box-shadow: 0 0 12px rgba(201,165,106,0.4);
}
.gal-card.rarity-R { border-color: #a67c5288; box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(166,124,82,0.35); }
.gal-card.rarity-SR {
  border-color: #9bb8cc99;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4), 0 0 16px rgba(140,180,210,0.12), inset 0 0 0 1px rgba(155,184,204,0.35);
}
.gal-card.rarity-SSR {
  border-color: #c9a56acc;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 0 20px rgba(201,165,106,0.22), inset 0 0 0 1px rgba(232,213,168,0.35);
}
.gal-card.locked { cursor: default; border-style: dashed; border-color: var(--gold-dim); }
.gal-card .lock-veil {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; background: rgba(8,6,4,0.35);
}
.gal-card .lock-veil .lk { font-size: 22px; color: var(--gold); opacity: 0.55; }
.gal-card .lock-veil .lt { font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); }
.gal-card .fav-dot {
  position: absolute; top: 10px; left: 10px; z-index: 3;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 8px var(--gold); display: none;
}
.gal-card.fav .fav-dot { display: block; }
.gal-empty-hint {
  grid-column: 1 / -1; text-align: center; padding: 28px 12px 8px;
  font-size: 12px; color: var(--text-dim); letter-spacing: 0.12em; line-height: 1.9;
}
.gal-away-link {
  display: inline-block; margin-top: 10px; padding: 6px 14px;
  border: 1px solid var(--gold-dim); border-radius: 999px;
  color: var(--gold); font-size: 11px; letter-spacing: 0.16em; cursor: pointer;
  background: rgba(26,22,18,0.4); font-family: inherit;
}

/* detail overlay */
#galDetail {
  position: absolute; inset: 0; z-index: 40;
  display: none; flex-direction: column;
  background: #050403; opacity: 0; transition: opacity 0.35s ease;
}
#galDetail.show { display: flex; opacity: 1; }
.gal-d-stage {
  flex: 1; position: relative; overflow: hidden; background: #0a0806;
  display: flex; align-items: center; justify-content: center;
}
.gal-d-img {
  width: 100%; height: 100%;
  background-size: contain; background-position: center center;
  background-repeat: no-repeat;
  transition: transform 0.35s ease;
}
.gal-d-img.zoom { transform: scale(1.12); }
.gal-d-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.gal-d-fx.rain::before, .gal-d-fx.rain::after {
  content: ""; position: absolute; inset: -20% 0;
  background-image: repeating-linear-gradient(
    105deg, transparent 0 8px, rgba(180,200,220,0.07) 8px 9px
  );
  animation: rainDrift 4.5s linear infinite; opacity: 0.55;
}
.gal-d-fx.rain::after { animation-duration: 6.2s; opacity: 0.3; transform: translateX(12px); }
@keyframes rainDrift {
  from { transform: translateY(-8%); }
  to { transform: translateY(12%); }
}
.gal-d-fx.frost .spark {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: #f0e0b0; box-shadow: 0 0 6px #e8d5a8;
  animation: frostFall 2.4s ease-out forwards; opacity: 0;
}
@keyframes frostFall {
  0% { opacity: 0; transform: translateY(-8px) scale(0.6); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(70vh) scale(1.1); }
}
.gal-d-frame {
  position: absolute; inset: 10px; pointer-events: none; border-radius: 4px; z-index: 2;
}
.gal-d-frame.R { border: 1px solid rgba(166,124,82,0.55); box-shadow: inset 0 0 0 1px rgba(166,124,82,0.2); }
.gal-d-frame.SR {
  border: 1px solid rgba(155,184,204,0.55);
  box-shadow: inset 0 0 0 1px rgba(155,184,204,0.25), 0 0 24px rgba(140,180,210,0.12);
}
.gal-d-frame.SSR {
  border: 1px solid rgba(201,165,106,0.75);
  box-shadow: inset 0 0 0 2px rgba(232,213,168,0.25), 0 0 28px rgba(201,165,106,0.22);
}
.gal-d-frame.SSR::before, .gal-d-frame.SSR::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border-color: var(--gold-bright); border-style: solid; opacity: 0.7;
}
.gal-d-frame.SSR::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.gal-d-frame.SSR::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.gal-d-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(14px + var(--safe-t)) 14px 0;
  display: flex; justify-content: space-between; align-items: center;
}
.gal-d-top button {
  appearance: none; border: 1px solid var(--gold-dim);
  background: rgba(20,16,12,0.55); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--gold-bright); font-family: inherit;
  font-size: 13px; letter-spacing: 0.12em; padding: 8px 12px;
  border-radius: 999px; cursor: pointer;
}
.gal-d-fav.on { color: #f0d090; border-color: var(--gold); background: rgba(201,165,106,0.2); }
.gal-d-info {
  position: relative; z-index: 5;
  margin: 0 12px calc(14px + var(--safe-b));
  padding: 16px 16px 14px;
  background: rgba(22,18,14,0.88);
  backdrop-filter: blur(18px) saturate(1.1);
  -webkit-backdrop-filter: blur(18px) saturate(1.1);
  border: 1px solid var(--gold-edge); border-radius: 16px;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
}
.gal-d-info.rarity-R { border-color: #a67c5288; }
.gal-d-info.rarity-SR { border-color: #9bb8cc99; box-shadow: 0 -8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(140,180,210,0.08); }
.gal-d-info.rarity-SSR { border-color: #c9a56acc; box-shadow: 0 -8px 32px rgba(0,0,0,0.45), 0 0 24px rgba(201,165,106,0.18); }
.gal-d-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.gal-d-name { font-size: 20px; letter-spacing: 0.28em; color: var(--gold-bright); font-weight: 500; }
.gal-d-theme { font-size: 12px; color: var(--text-dim); letter-spacing: 0.14em; margin-bottom: 4px; }
.gal-d-obtain { font-size: 11px; color: var(--gold); letter-spacing: 0.12em; opacity: 0.75; margin-bottom: 14px; }
.gal-d-actions { display: flex; gap: 8px; }
.gal-d-actions button {
  flex: 1; appearance: none; font-family: inherit; cursor: pointer;
  padding: 11px 10px; border-radius: 12px; font-size: 13px; letter-spacing: 0.16em;
  border: 1px solid var(--gold-edge); background: rgba(201,165,106,0.14); color: var(--gold-bright);
}
.gal-d-actions button.ghost {
  background: transparent; color: var(--text-dim); border-color: var(--gold-dim);
}

/* story reader */
#galStory {
  position: absolute; inset: 0; z-index: 45;
  display: none; flex-direction: column;
  background: #1a1612; opacity: 0; transition: opacity 0.35s ease;
}
#galStory.show { display: flex; opacity: 1; }
.gal-story-paper {
  flex: 1; overflow-y: auto;
  margin: calc(56px + var(--safe-t)) 18px calc(24px + var(--safe-b));
  padding: 28px 22px 32px;
  background:
    linear-gradient(180deg, rgba(243,235,224,0.97), rgba(232,220,200,0.96));
  border: 1px solid rgba(201,165,106,0.35);
  border-radius: 4px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 40px rgba(180,150,100,0.08);
  color: #2a241c;
  position: relative;
}
.gal-story-paper::before {
  content: ""; position: absolute; inset: 8px; pointer-events: none;
  border: 1px solid rgba(166,124,82,0.25); border-radius: 2px;
}
.gal-story-kicker {
  font-size: 11px; letter-spacing: 0.28em; color: #8a6a3e; margin-bottom: 10px;
}
.gal-story-title {
  font-size: 22px; letter-spacing: 0.32em; color: #1a1612;
  margin-bottom: 6px; font-weight: 500;
}
.gal-story-char {
  font-size: 12px; letter-spacing: 0.2em; color: #6a5a45; margin-bottom: 22px;
}
.gal-story-body {
  font-size: 15px; line-height: 2.05; letter-spacing: 0.08em;
  color: #2c261f; text-align: justify;
}
.gal-story-close {
  position: absolute; top: calc(14px + var(--safe-t)); left: 14px; z-index: 2;
  appearance: none; border: 1px solid var(--gold-dim);
  background: rgba(20,16,12,0.7); color: var(--gold-bright);
  font-family: inherit; font-size: 13px; letter-spacing: 0.12em;
  padding: 8px 12px; border-radius: 999px; cursor: pointer;
}

.tooltip-mask {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(8,6,4,0.55); display: none; align-items: flex-end;
  justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s;
}
.tooltip-mask.show { display: flex; opacity: 1; }
.tooltip-card {
  width: 100%; max-width: 360px;
  background: rgba(30,26,20,0.94); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--gold-edge); border-radius: 16px;
  padding: 20px 18px 18px; margin-bottom: calc(40px + var(--safe-b));

}
.tooltip-card h3 { font-size: 15px; letter-spacing: 0.2em; color: var(--gold-bright); font-weight: 500; margin-bottom: 10px; }

.tooltip-card .hint { margin-top: 14px; font-size: 11px; color: var(--gold); opacity: 0.6; letter-spacing: 0.15em; text-align: center; }
.tap-catcher { position: absolute; inset: 0; z-index: 10; }
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen active">

<script>
const IMG = {
  bg_shrine_rain: "images/bg_shrine_rain.png",
  bg_hut_fire: "images/bg_hut_fire.png",
  bg_hut_dawn: "images/bg_hut_dawn.png",
  bg_hut_day: "images/bg_hut_day.png",
  gu_idle: "images/gu_idle.png",
  gu_wet: "images/gu_wet.png",
  gu_worry: "images/gu_worry.png",
  gu_bowl: "images/gu_bowl.png",
  gu_mend: "images/gu_mend.png",
  gu_soft: "images/gu_soft.png",
  xie_awake: "images/xie_awake.png",
  xie_weak: "images/xie_weak.png",
  xie_sit: "images/xie_sit.png",
  cg_enter: "images/cg_enter.png",
  cg_water: "images/cg_water.png",
  cg_pass: "images/cg_pass.png",
  cg_dawn_talk: "images/cg_dawn_talk.png",
  cg_window: "images/cg_window.png",
  card_r_longshangyan: "images/card_r_longshangyan.png",
  card_sr_yusuogui: "images/card_sr_yusuogui.png",
  card_ssr_jiashangshuang: "images/card_ssr_jiashangshuang.png"
};

const LORE = {
  "天缝": "天裂开来的那道口子。旧年之后，雨里常带细碎的光，像谁把夜空缝坏了。人说靠近它的地方，梦与病会缠在一起。",
  "病壳": "身子还在，魂却像被抽薄。醒着也像在壳里漂。医家治不好，道士也不肯多说——只说先别让壳空掉。",
  "渡灵": "不是巫术里的夺舍。是把将散的气，慢慢渡回壳里。像焐手，像把水渡过干裂的唇。顾山说：这算不算医，他也不知道。",
  "廿四道": "城外廿四条旧路。有人说那是逃命的道，有人说是还愿的道。你醒来时，雨正落在其中一条上。"
};


const GALLERY = [
  {
    id: "gu_r_longshangyan",
    char: "顾山",
    name: "垄上烟",
    rarity: "R",
    theme: "农耕",
    image: "card_r_longshangyan",
    unlocked: true,
    story: "那年猎获薄，村里粮也紧。顾山在破祠后空垄里下了荞麦种。有人笑猎户耕田，他只应一声，把锄柄握热。黄昏炊烟起来时，他站在垄上，看烟散进山影里——人要活，不只靠血气，也靠一寸能长苗的土。",
    obtain: "第一章收集"
  },
  {
    id: "gu_sr_yusuogui",
    char: "顾山",
    name: "雨蓑归",
    rarity: "SR",
    theme: "雨夜蓑衣",
    image: "card_sr_yusuogui",
    unlocked: true,
    story: "山里夜雨，路只剩脚感。他披着旧蓑，斗笠压低，怀里是邻村托他带回的药包。雨打蓑衣的声音很密，像有人在身外说话。他没有加快，也没有停。到灯火处时，蓑上的水一串串落在门槛外，他才抬手摘笠——雨还在下，人已经回来了。",
    obtain: "第一章 · 雨夜"
  },
  {
    id: "gu_ssr_jiashangshuang",
    char: "顾山",
    name: "甲上霜",
    rarity: "SSR",
    theme: "军场旧影",
    image: "card_ssr_jiashangshuang",
    unlocked: true,
    story: "更早些年，关城外有霜。铁衣一夜结白，像谁在甲上写了无声的字。那一仗没有写进谁的功册，他却记得天亮时枪尖的冷。后来他卸甲入山，甲留在箱底。偶有霜降，他仍会在门边站一站——不是想念战场，只是确认：自己还选得了「不走那条路」。",
    obtain: "第一章 · 往事"
  }
];

const GALLERY_FAV_KEY = "tfp_gallery_favs";
function loadGalFavs() {
  try { return JSON.parse(localStorage.getItem(GALLERY_FAV_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveGalFavs(arr) { localStorage.setItem(GALLERY_FAV_KEY, JSON.stringify(arr)); }
function isGalFav(id) { return loadGalFavs().includes(id); }
function toggleGalFav(id) {
  const favs = loadGalFavs();
  const i = favs.indexOf(id);
  if (i >= 0) favs.splice(i, 1); else favs.push(id);
  saveGalFavs(favs); return favs.includes(id);
}

let galFilter = "ALL";
let galCurrent = null;
let galZoomed = false;

function renderGallery() {
  const grid = $("galGrid");
  grid.innerHTML = "";
  const list = GALLERY.filter(c => galFilter === "ALL" || c.rarity === galFilter);
  if (!list.length) {
    grid.innerHTML = `<div class="gal-empty-hint">此稀有度暂无立绘。<br>日后剧情推进，会有新影落进这里。</div>`;
  }
  list.forEach(card => {
    const el = document.createElement("div");
    const locked = !card.unlocked;
    el.className = `gal-card rarity-${card.rarity}` + (locked ? " locked" : "") + (isGalFav(card.id) ? " fav" : "");
    el.dataset.id = card.id;
    const thumbCls = locked ? "thumb locked" : "thumb";
    const lockHtml = locked
      ? `<div class="lock-veil"><div class="lk">锁</div><div class="lt">未解锁</div></div>`
      : "";
    el.innerHTML = `
      <div class="${thumbCls}" style="background-image:url('${imgUrl(card.image)}')"></div>
      <div class="shade"></div>
      <span class="gal-badge ${card.rarity}">${card.rarity}</span>
      <span class="fav-dot"></span>
      <div class="meta">
        <div class="cname">${locked ? "？？？" : card.name}</div>
        <div class="cname-char">${locked ? "——" : card.char}</div>
      </div>
      ${lockHtml}`;
    if (!locked) {
      el.addEventListener("click", () => openGalDetail(card.id));
    }
    grid.appendChild(el);
  });
  // secondary: 他这阵子 entry
  const hint = document.createElement("div");
  hint.className = "gal-empty-hint";
  hint.innerHTML = `山里的日子，也不止立绘一处。<br><button type="button" class="gal-away-link" id="btnGalToAway">他这阵子</button>`;
  grid.appendChild(hint);
  const awayBtn = hint.querySelector("#btnGalToAway");
  if (awayBtn) awayBtn.addEventListener("click", () => { renderAway(); showScreen("away"); });
}

function spawnFrostParticles(fx) {
  fx.innerHTML = "";
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.style.left = (8 + Math.random() * 84) + "%";
    s.style.top = (Math.random() * 30) + "%";
    s.style.animationDelay = (Math.random() * 1.2) + "s";
    s.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    fx.appendChild(s);
  }
  setTimeout(() => { if (fx.classList.contains("frost")) fx.innerHTML = ""; }, 3200);
}

function openGalDetail(id) {
  const card = GALLERY.find(c => c.id === id);
  if (!card || !card.unlocked) return;
  galCurrent = card;
  galZoomed = false;
  $("galDImg").classList.remove("zoom");
  $("galDImg").style.backgroundImage = `url("${imgUrl(card.image)}")`;
  $("galDFrame").className = "gal-d-frame " + card.rarity;
  $("galDBadge").className = "gal-badge " + card.rarity;
  $("galDBadge").textContent = card.rarity;
  $("galDName").textContent = card.name;
  $("galDTheme").textContent = card.char + " · " + card.theme;
  $("galDObtain").textContent = "获取 · " + (card.obtain || "—");
  $("galDInfo").className = "gal-d-info rarity-" + card.rarity;
  const favOn = isGalFav(card.id);
  $("btnGalFav").classList.toggle("on", favOn);
  $("btnGalFav").textContent = favOn ? "★ 已收藏" : "☆ 收藏";
  const fx = $("galDFx");
  fx.className = "gal-d-fx";
  fx.innerHTML = "";
  if (card.rarity === "SSR") {
    fx.classList.add("frost");
    spawnFrostParticles(fx);
  } else if (card.rarity === "SR") {
    fx.classList.add("rain");
  }
  $("galDetail").classList.add("show");
}

function closeGalDetail() {
  $("galDetail").classList.remove("show");
  $("galStory").classList.remove("show");
  galCurrent = null;
  $("galDFx").className = "gal-d-fx";
  $("galDFx").innerHTML = "";
  renderGallery();
}

function openGalStory() {
  if (!galCurrent) return;
  $("galSKicker").textContent = galCurrent.rarity + " · 往事";
  $("galSTitle").textContent = galCurrent.name;
  $("galSChar").textContent = galCurrent.char + " · " + galCurrent.theme;
  $("galSBody").textContent = galCurrent.story;
  $("galStory").classList.add("show");
}


const STORE_KEY = "ershidaolu_ch1_v2";
const TZ = "Asia/Hong_Kong";

function hkDateKey(d = new Date()) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
  }).format(d);
}
function hkHour(d = new Date()) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, hour: "numeric", hour12: false
  }).formatToParts(d);
  return parseInt(parts.find(p => p.type === "hour").value, 10);
}
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
  catch (e) { return {}; }
}
function saveStore(obj) { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }

const $ = (id) => document.getElementById(id);
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function imgUrl(key) { return IMG[key] || ""; }
function setBgEl(el, key) {
  if (!key) return;
  el.style.backgroundImage = `url("${imgUrl(key)}")`;
}
function updateStats() {
  $("stKe").textContent = state.vars.壳;
  $("stHun").textContent = state.vars.魂;
  $("stXin").textContent = state.vars.信;
  $("stXin2").textContent = state.vars.心;
  updateAffinity();
}
function updateAffinity() {
  const score = (state.vars.心 || 0) + (state.vars.信 || 0);
  const st = loadStore();
  const best = Math.max(score, st.bestAff || 0);
  st.bestAff = best; saveStore(st);
  const pips = document.querySelectorAll("#homeAff .aff-pip");
  const lit = Math.min(5, Math.floor(best / 2));
  pips.forEach((p, i) => p.classList.toggle("on", i < lit));
}
function applyDelta(delta) {
  if (!delta) return;
  for (const k of Object.keys(delta)) state.vars[k] = (state.vars[k] || 0) + delta[k];
  updateStats();
}

function clearType() {
  if (state.typeTimer) { clearTimeout(state.typeTimer); state.typeTimer = null; }
  state.typing = false;
}
function renderLoreSpans(raw) {
  const re = /\[\[(.+?)\]\]/g;
  let plain = raw.replace(re, "$1");
  let html = raw.replace(re, (_, w) => `<span class="lore" data-lore="${w}">${w}</span>`);
  return { html, plain };
}
function typeText(raw, onDone) {
  clearType();
  const box = $("dialogueText");
  const { html, plain } = renderLoreSpans(raw);
  state.fullText = plain; state.fullHtml = html; state.typeIdx = 0; state.typing = true;
  box.innerHTML = ""; $("tapHint").style.opacity = "0.35";
  const chars = Array.from(plain);
  function step() {
    if (!state.typing) return;
    state.typeIdx++;
    let display = plain.slice(0, state.typeIdx);
    for (const key of Object.keys(LORE)) {
      if (display.includes(key)) display = display.split(key).join(`<span class="lore" data-lore="${key}">${key}</span>`);
    }
    box.innerHTML = display;
    if (state.typeIdx >= chars.length) {
      state.typing = false; box.innerHTML = html; bindLoreClicks(box);
      $("tapHint").style.opacity = ""; if (onDone) onDone(); return;
    }
    const ch = chars[state.typeIdx - 1];
    let delay = 26;
    if ("，、；：".includes(ch)) delay = 110;
    else if ("。！？…".includes(ch)) delay = 200;
    else if (ch === "\n") delay = 140;
    state.typeTimer = setTimeout(step, delay);
  }
  step();
}
function completeType() {
  if (!state.typing) return;
  clearType();
  const box = $("dialogueText");
  box.innerHTML = state.fullHtml || state.fullText;
  bindLoreClicks(box); $("tapHint").style.opacity = "";
}
function bindLoreClicks(root) {
  root.querySelectorAll(".lore").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); openLore(el.dataset.lore); });
  });
}
function openLore(key) {
  const body = LORE[key]; if (!body) return;
  $("tipTitle").textContent = "何谓此句 · " + key;
  $("tipBody").textContent = body;
  $("tooltipMask").classList.add("show");
}
$("tooltipMask").addEventListener("click", () => $("tooltipMask").classList.remove("show"));

function setScene(node) {
  const bg = $("sceneBg");
  const fx = $("sceneFx");
  const nextUrl = imgUrl(node.bg);
  bg.style.opacity = "0";
  setTimeout(() => { bg.style.backgroundImage = `url("${nextUrl}")`; bg.style.opacity = "1"; }, 200);
  bg.classList.remove("dim", "zoom");
  fx.classList.remove("pass-glow");
  if (node.effect === "pass") { bg.classList.add("dim", "zoom"); fx.classList.add("pass-glow"); }

  // Day tag
  $("dayTag").textContent = node.day || "第一夜";

  // Avatar float for speaker portrait; if bg is already a CG, skip large char layer
  const av = $("avatarFloat");
  const sc = $("sceneChar");
  const isCg = node.bg && node.bg.startsWith("cg_");
  if (node.avatar && !isCg) {
    // show soft mid-char for non-CG scenes when avatar is gu_*
    if (node.avatar.startsWith("gu_")) {
      sc.style.backgroundImage = `url("${imgUrl(node.avatar)}")`;
      sc.classList.add("show");
    } else {
      sc.classList.remove("show");
    }
  } else {
    sc.classList.remove("show");
  }
  if (node.avatar) {
    av.style.backgroundImage = `url("${imgUrl(node.avatar)}")`;
    av.classList.add("show");
  } else {
    av.classList.remove("show");
  }

  const np = $("nameplate");
  const sn = $("speakerName");
  const dt = $("dialogueText");
  if (node.speaker === "narr" || !node.name) {
    np.style.display = "none"; dt.classList.remove("thought");
  } else {
    np.style.display = "flex"; sn.textContent = node.name;
    if (node.speaker === "thought") dt.classList.add("thought");
    else dt.classList.remove("thought");
  }
}

function showChoices(choices) {
  state.choiceMode = true;
  const box = $("choices"); box.innerHTML = "";
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "choice-btn"; btn.textContent = c.text;
    btn.addEventListener("click", (e) => {
      e.stopPropagation(); applyDelta(c.delta);
      state.choiceMode = false; box.classList.remove("show"); box.innerHTML = "";
      goNode(c.next);
    });
    box.appendChild(btn);
  });
  box.classList.add("show"); $("tapHint").style.display = "none";
}
function hideChoices() {
  state.choiceMode = false;
  $("choices").classList.remove("show"); $("choices").innerHTML = "";
  $("tapHint").style.display = "";
}
function goNode(id) {
  const node = NODES[id]; if (!node) return;
  state.nodeId = id; hideChoices(); $("endingCard").classList.remove("show");
  if (node.isEnd) { showEnding(); return; }
  applyDelta(node.delta); setScene(node);
  if (node.ending) state.pendingEnding = node.ending;
  typeText(node.text, () => { if (node.choices) showChoices(node.choices); });
}
function advance() {
  if (state.ended || state.choiceMode) return;
  if ($("tooltipMask").classList.contains("show")) return;
  if (state.typing) {
    completeType();
    const node = NODES[state.nodeId];
    if (node && node.choices) showChoices(node.choices);
    return;
  }
  const node = NODES[state.nodeId];
  if (!node || node.choices) return;
  if (node.next) goNode(node.next);
}
function showEnding() {
  state.ended = true;
  const end = state.pendingEnding || { title: "雨夜破祠", body: "第一章终。" };
  $("endingTitle").textContent = end.title;
  $("endingBody").textContent = end.body;
  $("endingCard").classList.add("show");
  const st = loadStore();
  st.chapter1Done = true; st.endingTitle = end.title;
  st.bestAff = Math.max(st.bestAff || 0, (state.vars.心||0)+(state.vars.信||0));
  saveStore(st); updateAffinity();
}
function startChapter() {
  state.vars = { 壳: 1, 魂: 0, 信: 0, 心: 0 };
  state.ended = false; state.pendingEnding = null;
  updateStats(); showScreen("theater"); goNode("n01");
}

function renderPostcards() {
  const grid = $("cardGrid"); grid.innerHTML = "";
  const st = loadStore();
  const today = hkDateKey();
  if (!st.postcards) st.postcards = {};
  if (st.chapter1Done && !st.postcards[today]) {
    st.postcards[today] = { img: "cg_window", title: "门框薄光" };
    saveStore(st);
  }
  // locked placeholder first
  const lock = document.createElement("div");
  lock.className = "pcard locked-ch";
  lock.innerHTML = `<div class="lock-ico">封</div><div class="slot-label">${st.chapter1Done ? "第一章已启" : "第一章后解锁"}</div>`;
  grid.appendChild(lock);

  const days = [];
  for (let i = 4; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(hkDateKey(d));
  }
  const seen = new Set();
  days.forEach(day => {
    if (seen.has(day)) return; seen.add(day);
    const card = document.createElement("div");
    const data = st.postcards[day];
    if (data && st.chapter1Done) {
      card.className = "pcard unlocked";
      card.style.backgroundImage = `url("${imgUrl(data.img)}")`;
      const lab = document.createElement("div");
      lab.className = "slot-label";
      lab.textContent = (day === today ? "今日 · " : "") + (data.title || day.slice(5));
      card.appendChild(lab);
    } else {
      card.className = "pcard empty";
      const lab = document.createElement("div");
      lab.className = "slot-label";
      lab.style.whiteSpace = "pre-line";
      lab.textContent = day.slice(5).replace("-", "/") + "\n" + (st.chapter1Done ? "未至" : "待启");
      card.appendChild(lab);
    }
    grid.appendChild(card);
  });
}

const AWAY_BEATS = [
  { when: "你离开之后", img: "gu_idle", text: "他把碗洗了，水倒进门外的石槽。雨丝斜过屋檐，他在门槛上坐了一会儿，没有点第二盏灯。" },
  { when: "入夜稍深", img: "gu_worry", text: "山路上传来一下极轻的踏响。他起身，把门闩好，回屋时在你常坐的那侧多添了一块干柴。" },
  { when: "近卯时", img: "gu_mend", text: "猎网又理过一遍。他尝了一口药罐，皱了皱眉，却仍把火调小。窗外天缝那道光淡了些。他说了句谁也没听见的话：先活。" }
];
function checkAwayOnOpen() {
  const st = loadStore();
  const now = Date.now();
  const last = st.lastVisit || now;
  const gap = now - last;
  st.lastVisit = now;
  if (gap >= 5 * 60 * 1000) { st.pendingAway = true; st.awayGeneratedAt = now; }
  saveStore(st); return !!st.pendingAway;
}
function forceAway() {
  const st = loadStore();
  st.pendingAway = true; st.lastVisit = Date.now() - 6 * 60 * 1000;
  saveStore(st); renderAway(); showScreen("away");
}
function renderAway() {
  const scroll = $("awayScroll");
  const st = loadStore();
  if (!st.pendingAway && !st.awaySeen) {
    scroll.innerHTML = `<div class="away-empty">他这阵子都在。<br>你若离开片刻再回来，<br>或许能看见他独自做过的事。</div>`;
    return;
  }
  if (st.pendingAway) { st.awaySeen = true; st.pendingAway = false; saveStore(st); }
  scroll.innerHTML = "";
  AWAY_BEATS.forEach(b => {
    const el = document.createElement("div");
    el.className = "away-beat";
    el.innerHTML = `<div class="illust" style="background-image:url('${imgUrl(b.img)}')"></div>
      <div class="body"><div class="when">${b.when}</div><div>${b.text}</div></div>`;
    scroll.appendChild(el);
  });
}

let bubbleTimer = null;
function onHomePortraitTap() {
  const char = $("homeChar"); const bubble = $("homeBubble");
  const line = HOME_LINES[Math.floor(Math.random() * HOME_LINES.length)];
  bubble.textContent = line; bubble.classList.add("show"); char.classList.add("react");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { bubble.classList.remove("show"); char.classList.remove("react"); }, 2200);
}

function initHome() {
  setBgEl($("homeBg"), "bg_hut_fire");
  setBgEl($("homeChar"), "gu_idle");
  $("homeMood").textContent = homeMoodLine();
  $("homeStateLabel").textContent = homeStateLine();
  checkAwayOnOpen(); updateAffinity();
}

$("btnMain").addEventListener("click", () => startChapter());
$("btnGallery").addEventListener("click", () => { galFilter = "ALL"; document.querySelectorAll(".gal-chip").forEach(c => c.classList.toggle("on", c.dataset.rarity === "ALL")); renderGallery(); showScreen("gallery"); });
$("btnPostcard").addEventListener("click", () => { renderPostcards(); showScreen("postcard"); });
$("btnPcBack").addEventListener("click", () => showScreen("home"));
$("btnAwayBack").addEventListener("click", () => showScreen("gallery"));
$("btnGalBack").addEventListener("click", () => showScreen("home"));
$("btnGalDClose").addEventListener("click", () => closeGalDetail());
$("btnGalFav").addEventListener("click", () => {
  if (!galCurrent) return;
  const on = toggleGalFav(galCurrent.id);
  $("btnGalFav").classList.toggle("on", on);
  $("btnGalFav").textContent = on ? "★ 已收藏" : "☆ 收藏";
});
$("btnGalStory").addEventListener("click", () => openGalStory());
$("btnGalStoryClose").addEventListener("click", () => $("galStory").classList.remove("show"));
$("btnGalZoom").addEventListener("click", () => {
  galZoomed = !galZoomed;
  $("galDImg").classList.toggle("zoom", galZoomed);
  $("btnGalZoom").textContent = galZoomed ? "还原" : "沉浸欣赏";
});
$("galDStage").addEventListener("click", (e) => {
  if (e.target.closest(".gal-d-top") || e.target.closest("button")) return;
  galZoomed = !galZoomed;
  $("galDImg").classList.toggle("zoom", galZoomed);
  $("btnGalZoom").textContent = galZoomed ? "还原" : "沉浸欣赏";
});
document.querySelectorAll(".gal-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    galFilter = chip.dataset.rarity;
    document.querySelectorAll(".gal-chip").forEach(c => c.classList.toggle("on", c === chip));
    renderGallery();
  });
});
$("btnTheaterBack").addEventListener("click", () => {
  clearType(); hideChoices(); state.ended = false; showScreen("home");
});
$("btnEndingHome").addEventListener("click", () => {
  $("endingCard").classList.remove("show"); state.ended = false; showScreen("home");
});
$("btnDebugAway").addEventListener("click", (e) => { e.stopPropagation(); forceAway(); });
$("homeChar").addEventListener("click", onHomePortraitTap);
$("tapCatcher").addEventListener("click", advance);
$("dialogueBox").addEventListener("click", (e) => {
  if (e.target.classList.contains("lore")) return; advance();
});
document.addEventListener("dragstart", e => e.preventDefault());
initHome(); updateStats();
</script>
